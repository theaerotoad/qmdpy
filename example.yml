vector_quantization: int8  # Options: "none", "int8", "bit" (or "binary")
db_path: "./example.db"
history_db_path: "./qmd-history.db"

llm_url: "http://127.0.0.1:9888" # Default: http://127.0.0.1:8888
# api_key: "sk-..."              # Optional API key for primary LLM endpoint

# --- Optional Independent Service Endpoints & Keys ---
# embed_url: "http://127.0.0.1:8889"     # Separate URL for embeddings
# embed_api_key: "sk-..."               # API key for embedding endpoint
# rerank_url: "http://127.0.0.1:8890"    # Separate URL for reranking
# rerank_api_key: "sk-..."               # API key for reranker endpoint

# --- Vision & Multimodal Image Processing ---
# Option A: OpenAI-compatible Multimodal LLM endpoint for OCR & markdown extraction
# multimodal_url: "http://127.0.0.1:9888" # Or "https://api.openai.com"
# multimodal_api_key: "sk-..."
# multimodal_model: "gpt-4o-mini"         # e.g. "gpt-4o-mini", "qwen-vl-max"
# multimodal_prompt: ""                   # Optional custom OCR/markdown prompt

# Option B: Dedicated Vision API endpoint
# vision_url: "http://127.0.0.1:8891/detect"
# vision_api_key: "sk-..."

# Maximum number of images processed simultaneously across documents
max_image_concurrency: 4                 # Default: 4

strip_links: true                # Simplify [text](url) to just "text"
target_chunk_size: 1024          # Optimal character count per chunk
max_chunk_size: 2048             # Hard limit before forcing a split

# --- Search Sizing & Limit Configurations ---
fts_limit: 200          # Max lexical (FTS) candidates fetched per query pass (Default: 50)
vec_limit: 200          # Max vector (semantic) candidates fetched per query pass (Default: 50)
rerank_candidates: 40   # Number of fused RRF candidates passed to the reranker (Default: 20)
default_limit: 10       # Default number of final results returned if --limit isn't passed (Default: 10)


#rerank_model: "Qwen Rerank 0.6B"
rerank_model: "Ettin Reranker"
embed_model: "EmbeddingGemma 300m"

collections:
  # Option 2: Explicit list of allowed file extensions
  Books:
    path: "/home/user/Documents/Books"
    file_extensions:
      - .md
