<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMD Knowledge Engine</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom styling for rendered markdown content & SERP snippet preview */
        .prose pre { background-color: #0f172a; padding: 0.875rem; border-radius: 0.375rem; overflow-x: auto; margin: 0.5rem 0; border: 1px solid #1e293b; }
        .prose code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: #93c5fd; font-size: 0.875em; }
        .prose p { margin-bottom: 0.5rem; line-height: 1.6; }
        .prose p:last-child { margin-bottom: 0; }
        .prose h1, .prose h2, .prose h3 { font-weight: 600; margin-top: 0.75rem; margin-bottom: 0.375rem; color: #f8fafc; }
        .prose a { color: #60a5fa; text-decoration: underline; }
        .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .prose table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; text-align: left; font-size: 0.875rem; }
        .prose th, .prose td { border: 1px solid #334155; padding: 0.4rem 0.6rem; }
        .prose th { background-color: #1e293b; color: #e2e8f0; }

        /* Highlight mark styling */
        mark.qmd-highlight {
            background-color: rgba(234, 179, 8, 0.22);
            color: #fef08a;
            padding: 0.05rem 0.2rem;
            border-radius: 0.2rem;
            font-weight: 600;
        }

        /* Layout State Transitions */
        #app-container.state-hero #serp-top-bar { display: none; }
        #app-container.state-hero #hero-section { display: flex; }
        #app-container.state-hero #results-wrapper { display: none; }

        #app-container.state-serp #serp-top-bar { display: block; }
        #app-container.state-serp #hero-section { display: none; }
        #app-container.state-serp #results-wrapper { display: block; }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="app-container" class="state-hero min-h-screen flex flex-col">
        
        <!-- ================================================================= -->
        <!-- STATE A: HERO LANDING STATE (Centered Google / DDG Style)         -->
        <!-- ================================================================= -->
        <div id="hero-section" class="flex-1 flex-col justify-center items-center px-4 py-12 max-w-4xl mx-auto w-full">
            <!-- Top Utility Bar (Hero Mode) -->
            <div class="w-full flex justify-between items-center mb-16 text-xs text-slate-400">
                <div class="flex items-center gap-2">
                    <span id="hero-session-badge" class="font-mono bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full text-slate-400">
                        Session: <span class="session-id-val text-slate-200">-</span>
                    </span>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" class="btn-open-tree bg-slate-900 border border-slate-800 hover:border-slate-700 hover:text-slate-200 py-1.5 px-3 rounded-md flex items-center gap-1.5 transition">
                        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                        Collection Tree
                    </button>
                    <div id="hero-collections-container" class="flex gap-1.5"></div>
                </div>
            </div>

            <!-- Hero Branding -->
            <div class="text-center mb-8">
                <h1 class="text-5xl md:text-6xl font-black tracking-tight text-white mb-2 bg-gradient-to-r from-blue-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent">
                    Q M D
                </h1>
                <p class="text-slate-400 text-sm md:text-base font-medium tracking-wide">
                    Quick Markdown Knowledge Engine
                </p>
            </div>

            <!-- Hero Main Search Box Form -->
            <div class="w-full max-w-2xl">
                <form id="hero-search-form" class="space-y-4" onsubmit="handleFormSubmit(event, 'hero')">
                    <div class="relative flex items-center shadow-2xl rounded-2xl bg-slate-900 border border-slate-800 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition duration-200">
                        <div class="pl-4 text-slate-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" id="hero-query" class="w-full bg-transparent text-white px-4 py-4 text-base focus:outline-none placeholder-slate-500" placeholder="Search your markdown knowledge base..." autocomplete="off" autofocus required>
                        <div class="pr-2 flex items-center gap-1.5">
                            <button type="button" class="btn-open-tree text-slate-400 hover:text-slate-200 p-2 rounded-lg hover:bg-slate-800 transition" title="Browse Collection Files">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            </button>
                            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2.5 rounded-xl transition shadow-sm text-sm">
                                Search
                            </button>
                        </div>
                    </div>

                    <!-- Search Mode Pills -->
                    <div class="flex flex-wrap justify-center items-center gap-2 text-xs pt-2">
                        <div class="inline-flex bg-slate-900 p-1 rounded-xl border border-slate-800 shadow-inner">
                            <button type="button" class="mode-btn px-3 py-1.5 rounded-lg transition font-medium bg-blue-600 text-white" data-mode="search">
                                Search
                            </button>
                            <button type="button" class="mode-btn px-3 py-1.5 rounded-lg transition font-medium text-slate-400 hover:text-slate-200" data-mode="doc">
                                Document View
                            </button>
                            <button type="button" class="mode-btn px-3 py-1.5 rounded-lg transition font-medium text-slate-400 hover:text-slate-200" data-mode="grep">
                                Grep
                            </button>
                        </div>

                        <!-- Options Dropdown Trigger -->
                        <button type="button" class="toggle-advanced-btn bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-400 hover:text-slate-200 px-3 py-2 rounded-xl flex items-center gap-1.5 transition">
                            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                            <span>Options</span>
                        </button>
                    </div>

                    <!-- Scope Shortcuts & Quick Settings (Hero Mode) -->
                    <div class="flex flex-wrap justify-center items-center gap-3 text-xs text-slate-400 pt-1">
                        <div class="flex items-center gap-1.5">
                            <span>Collection:</span>
                            <select id="hero-collection-filter" class="collection-select bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-slate-200 focus:outline-none focus:border-blue-500">
                                <option value="">All Collections</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span>Limit:</span>
                            <input type="number" id="hero-limit" class="limit-input w-16 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-center text-slate-200 focus:outline-none focus:border-blue-500" value="10">
                        </div>
                    </div>

                    <!-- Advanced Filters Expandable Drawer -->
                    <div id="hero-advanced-panel" class="hidden bg-slate-900/90 border border-slate-800 rounded-2xl p-5 mt-4 space-y-4 shadow-xl">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5 text-xs">
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">Lexical Override (FTS)</label>
                                <input type="text" id="hero-lex" class="lex-input w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500" placeholder="e.g. strict terms">
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">Title Filter</label>
                                <input type="text" id="hero-title" class="title-input w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500" placeholder="e.g. store">
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">Path Filter</label>
                                <input type="text" id="hero-path" class="path-input w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500" placeholder="e.g. src/qmd/">
                            </div>
                        </div>
                        
                        <div class="flex flex-wrap gap-4 text-xs pt-2 border-t border-slate-800 items-center text-slate-300">
                            <label class="flex items-center gap-1.5 cursor-pointer hover:text-white" id="hero-label-rerank">
                                <input type="checkbox" id="hero-rerank" class="rerank-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                                <span>LLM Reranking</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer hover:text-white hidden" id="hero-label-regex">
                                <input type="checkbox" id="hero-grep-regex" class="regex-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                                <span>Regex Pattern</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer hover:text-white hidden" id="hero-label-case">
                                <input type="checkbox" id="hero-grep-case" class="case-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                                <span>Case Sensitive</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer hover:text-white">
                                <input type="checkbox" id="hero-exclude-seen" class="exclude-seen-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                                <span>Exclude Seen Chunks</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer hover:text-white">
                                <input type="checkbox" id="hero-redact-pii" class="redact-pii-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                                <span>Redact PII</span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- ================================================================= -->
        <!-- STATE B: SERP HEADER BAR (Sticky Top Header for Results)          -->
        <!-- ================================================================= -->
        <header id="serp-top-bar" class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
                <!-- Mini Logo (Returns to Hero) -->
                <a href="javascript:void(0)" onclick="returnToHero()" class="flex items-center gap-2 group flex-shrink-0">
                    <span class="text-2xl font-black tracking-tight bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent group-hover:opacity-90 transition">
                        QMD
                    </span>
                </a>

                <!-- Compact SERP Search Input -->
                <form id="serp-search-form" class="flex-1 max-w-2xl flex items-center" onsubmit="handleFormSubmit(event, 'serp')">
                    <div class="relative w-full flex items-center bg-slate-900 border border-slate-800 rounded-xl focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition">
                        <input type="text" id="serp-query" class="w-full bg-transparent text-white pl-4 pr-16 py-2 text-sm focus:outline-none placeholder-slate-500" placeholder="Search markdown..." autocomplete="off" required>
                        <div class="absolute right-1.5 flex items-center gap-1">
                            <button type="button" class="btn-open-tree text-slate-400 hover:text-slate-200 p-1 rounded hover:bg-slate-800 transition" title="Browse Collection Files">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            </button>
                            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1 rounded-lg text-xs transition">
                                Search
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Header Actions & Session Pill -->
                <div class="flex items-center gap-2 flex-shrink-0 text-xs">
                    <span id="serp-session-badge" class="font-mono bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-md text-slate-400 hidden sm:inline-block">
                        Session: <span class="session-id-val text-slate-200">-</span>
                    </span>
                    <button type="button" class="btn-open-tree bg-slate-900 border border-slate-800 hover:border-slate-700 hover:text-slate-200 py-1 px-2.5 rounded-md flex items-center gap-1.5 transition text-slate-300">
                        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                        Tree
                    </button>
                </div>
            </div>

            <!-- SERP Secondary Filter & Mode Strip -->
            <div class="max-w-6xl mx-auto px-4 py-2 border-t border-slate-900 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-400">
                <div class="flex items-center gap-3">
                    <div class="inline-flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                        <button type="button" class="mode-btn px-2.5 py-1 rounded-md transition font-medium bg-blue-600 text-white" data-mode="search">
                            Search
                        </button>
                        <button type="button" class="mode-btn px-2.5 py-1 rounded-md transition font-medium text-slate-400 hover:text-slate-200" data-mode="doc">
                            Doc View
                        </button>
                        <button type="button" class="mode-btn px-2.5 py-1 rounded-md transition font-medium text-slate-400 hover:text-slate-200" data-mode="grep">
                            Grep
                        </button>
                    </div>

                    <div class="flex items-center gap-1.5 border-l border-slate-800 pl-3">
                        <span>Col:</span>
                        <select id="serp-collection-filter" class="collection-select bg-slate-900 border border-slate-800 rounded px-2 py-0.5 text-slate-200 focus:outline-none">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <span>Limit:</span>
                        <input type="number" id="serp-limit" class="limit-input w-12 bg-slate-900 border border-slate-800 rounded px-1.5 py-0.5 text-center text-slate-200 focus:outline-none" value="10">
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button type="button" class="toggle-advanced-btn hover:text-slate-200 flex items-center gap-1 transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        <span>More Filters</span>
                    </button>
                    <div id="serp-collections-container" class="flex gap-1"></div>
                </div>
            </div>

            <!-- SERP Advanced Filters Dropdown Drawer -->
            <div id="serp-advanced-panel" class="hidden bg-slate-900 border-t border-b border-slate-800 px-4 py-3">
                <div class="max-w-6xl mx-auto space-y-3">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-400 mb-1 font-medium">Lexical Override (FTS)</label>
                            <input type="text" id="serp-lex" class="lex-input w-full bg-slate-950 border border-slate-800 text-slate-200 rounded px-2.5 py-1 focus:outline-none focus:border-blue-500" placeholder="e.g. strict terms">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-medium">Title Filter</label>
                            <input type="text" id="serp-title" class="title-input w-full bg-slate-950 border border-slate-800 text-slate-200 rounded px-2.5 py-1 focus:outline-none focus:border-blue-500" placeholder="e.g. store">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-medium">Path Filter</label>
                            <input type="text" id="serp-path" class="path-input w-full bg-slate-950 border border-slate-800 text-slate-200 rounded px-2.5 py-1 focus:outline-none focus:border-blue-500" placeholder="e.g. src/qmd/">
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-4 text-xs pt-2 border-t border-slate-800 items-center text-slate-300">
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white" id="serp-label-rerank">
                            <input type="checkbox" id="serp-rerank" class="rerank-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                            <span>LLM Rerank</span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white hidden" id="serp-label-regex">
                            <input type="checkbox" id="serp-grep-regex" class="regex-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                            <span>Regex</span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white hidden" id="serp-label-case">
                            <input type="checkbox" id="serp-grep-case" class="case-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                            <span>Case Sensitive</span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white">
                            <input type="checkbox" id="serp-exclude-seen" class="exclude-seen-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                            <span>Exclude Seen</span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white">
                            <input type="checkbox" id="serp-redact-pii" class="redact-pii-check rounded bg-slate-950 border-slate-700 text-blue-600 focus:ring-0">
                            <span>Redact PII</span>
                        </label>
                    </div>
                </div>
            </div>
        </header>

        <!-- ================================================================= -->
        <!-- STATE B: RESULTS VIEWPORT (Classic SERP List Layout)              -->
        <!-- ================================================================= -->
        <main id="results-wrapper" class="flex-1 max-w-5xl mx-auto w-full px-4 py-6">
            <!-- Results Stats & Context Export Toolbar -->
            <div id="results-toolbar" class="hidden flex flex-wrap items-center justify-between gap-3 pb-4 mb-6 border-b border-slate-800/80">
                <div id="result-stats" class="text-xs text-slate-400 font-mono"></div>
                <div class="flex items-center gap-2">
                    <button id="copy-json" class="bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs py-1.5 px-3 rounded-lg transition flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy XML for LLM
                    </button>
                    <button id="copy-prompt" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium py-1.5 px-3 rounded-lg transition shadow-sm flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Copy Prompt & References
                    </button>
                </div>
            </div>

            <!-- SERP Results Container -->
            <div id="results" class="space-y-6 pb-24"></div>
        </main>
    </div>

    <!-- ================================================================= -->
    <!-- SLIDE-OVER PANELS: Document Viewer & Collection File Tree         -->
    <!-- ================================================================= -->

    <!-- Collection Tree Drawer -->
    <div id="tree-drawer" class="fixed inset-0 overflow-hidden z-40 pointer-events-none hidden">
        <div class="absolute inset-0 overflow-hidden">
            <div id="tree-backdrop" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity opacity-0 pointer-events-auto duration-300"></div>
            <div class="fixed inset-y-0 left-0 max-w-md w-full flex">
                <div id="tree-panel" class="w-full bg-slate-900 border-r border-slate-800 shadow-2xl transform transition-transform -translate-x-full pointer-events-auto flex flex-col duration-300">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            <h2 class="text-base font-semibold text-white">Collection Files</h2>
                        </div>
                        <button id="close-tree" class="text-slate-400 hover:text-white transition focus:outline-none">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    <div class="px-6 py-3 border-b border-slate-800 bg-slate-900/50 flex flex-col gap-2 text-xs text-slate-400">
                        <div class="flex items-center justify-between">
                            <span>Directory Hierarchy</span>
                            <button id="refresh-tree" class="hover:text-blue-400 flex items-center gap-1 transition">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                Refresh
                            </button>
                        </div>
                        <input type="text" id="tree-filter-input" placeholder="Filter files (e.g. guide or .py)..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                    </div>
                    <div id="tree-content" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs font-mono"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Document Slide-Over Viewer -->
    <div id="slide-over" class="fixed inset-0 overflow-hidden z-50 pointer-events-none hidden">
        <div class="absolute inset-0 overflow-hidden">
            <div id="slide-backdrop" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity opacity-0 pointer-events-auto duration-300"></div>
            <div class="fixed inset-y-0 right-0 max-w-3xl w-full flex">
                <div id="slide-panel" class="w-full bg-slate-900 border-l border-slate-800 shadow-2xl transform transition-transform translate-x-full pointer-events-auto flex flex-col duration-300">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950">
                        <div class="flex flex-col min-w-0 pr-4">
                            <span id="slide-uri" class="text-xs font-mono text-slate-400 truncate"></span>
                            <h2 id="slide-title" class="text-lg font-semibold text-white truncate">Document Title</h2>
                        </div>
                        <button id="close-slide" class="text-slate-400 hover:text-white transition focus:outline-none flex-shrink-0">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    <div id="slide-content" class="flex-1 overflow-y-auto p-8 prose prose-invert max-w-none"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- JAVASCRIPT LOGIC                                                  -->
    <!-- ================================================================= -->
    <script>
        // State Management
        let activeMode = 'search'; // 'search' | 'doc' | 'grep'
        let lastRawJson = null;
        let lastSearchType = 'chunk';
        let currentSessionId = null;
        let treeFilterTimer = null;

        // UI State Switching (Hero vs SERP)
        function setAppState(state) {
            const container = document.getElementById('app-container');
            if (state === 'serp') {
                container.classList.remove('state-hero');
                container.classList.add('state-serp');
            } else {
                container.classList.remove('state-serp');
                container.classList.add('state-hero');
            }
        }

        function returnToHero() {
            setAppState('hero');
            document.getElementById('hero-query').value = document.getElementById('serp-query').value;
            document.getElementById('hero-query').focus();
        }

        // Mode Switching
        function setMode(mode) {
            activeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                const isActive = btn.dataset.mode === mode;
                btn.className = `mode-btn px-2.5 py-1 rounded-md transition font-medium ${isActive ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'}`;
            });

            const isGrep = mode === 'grep';
            document.querySelectorAll('#hero-label-rerank, #serp-label-rerank').forEach(el => el.classList.toggle('hidden', isGrep));
            document.querySelectorAll('#hero-label-regex, #serp-label-regex').forEach(el => el.classList.toggle('hidden', !isGrep));
            document.querySelectorAll('#hero-label-case, #serp-label-case').forEach(el => el.classList.toggle('hidden', !isGrep));

            const placeholder = isGrep ? "Grep pattern (e.g. def _[a-z_]+ or exact text)..." : "Search your knowledge base...";
            document.getElementById('hero-query').placeholder = placeholder;
            document.getElementById('serp-query').placeholder = isGrep ? "Grep pattern..." : "Search markdown...";
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => setMode(e.target.dataset.mode));
        });

        // Advanced Options Toggle
        document.querySelectorAll('.toggle-advanced-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const heroPanel = document.getElementById('hero-advanced-panel');
                const serpPanel = document.getElementById('serp-advanced-panel');
                heroPanel.classList.toggle('hidden');
                serpPanel.classList.toggle('hidden');
            });
        });

        // Two-way Form Sync between Hero and SERP inputs
        function syncInputs(sourcePrefix) {
            const targetPrefix = sourcePrefix === 'hero' ? 'serp' : 'hero';
            const fields = ['query', 'collection-filter', 'limit', 'lex', 'title', 'path'];
            fields.forEach(f => {
                const src = document.getElementById(`${sourcePrefix}-${f}`);
                const tgt = document.getElementById(`${targetPrefix}-${f}`);
                if (src && tgt) tgt.value = src.value;
            });

            const checks = ['rerank', 'grep-regex', 'grep-case', 'exclude-seen', 'redact-pii'];
            checks.forEach(c => {
                const src = document.getElementById(`${sourcePrefix}-${c}`);
                const tgt = document.getElementById(`${targetPrefix}-${c}`);
                if (src && tgt) tgt.checked = src.checked;
            });
        }

        // XML Escaping & Highlighting Utilities
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeXmlAttr(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function highlightKeywords(text, query) {
            if (!query || !text) return text;
            const terms = query.replace(/[^\w\s]/g, ' ')
                .split(/\s+/)
                .filter(t => t.length > 1 && !['and', 'or', 'not', 'the', 'is', 'in', 'to'].includes(t.toLowerCase()));
            if (terms.length === 0) return text;

            const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
            const regex = new RegExp(`(${pattern})`, 'gi');
            return text.replace(regex, '<mark class="qmd-highlight">$1</mark>');
        }

        // XML Formatting for Context Export
        function formatResultsToXml(results, type, query, sessionId) {
            if (!results || results.length === 0) {
                return `<search_results query="${escapeXmlAttr(query)}" total_matches="0">\n</search_results>`;
            }

            const sessionAttr = sessionId ? ` session_id="${escapeXmlAttr(sessionId)}"` : '';

            if (type === 'grep') {
                const lines = [`<grep_results pattern="${escapeXmlAttr(query)}" total_matches="${results.length}">`];
                const docs = {};
                results.forEach(m => {
                    const k = (m.collection || '') + '/' + (m.path || '');
                    if (!docs[k]) docs[k] = { uri: m.collection ? `qmd://${m.collection}/${m.path}` : m.path, title: m.title || '', matches: [] };
                    docs[k].matches.push(m);
                });
                Object.values(docs).forEach(d => {
                    lines.push(`  <document uri="${escapeXmlAttr(d.uri)}" title="${escapeXmlAttr(d.title)}">`);
                    d.matches.forEach(m => {
                        lines.push(`    <match line="${m.line_number}">${escapeXmlAttr(m.line_text)}</match>`);
                    });
                    lines.push('  </document>');
                });
                lines.push('</grep_results>');
                return lines.join('\n');
            } else if (type === 'doc') {
                const totalMatches = results.reduce((acc, doc) => acc + (doc.chunks ? doc.chunks.length : 0), 0);
                const lines = [`<search_results query="${escapeXmlAttr(query)}" total_matches="${totalMatches}" total_documents="${results.length}"${sessionAttr}>`];

                results.forEach(doc => {
                    const uri = doc.collection ? `qmd://${doc.collection}/${doc.path}` : (doc.path || '');
                    lines.push(`  <document uri="${escapeXmlAttr(uri)}" title="${escapeXmlAttr(doc.title || '')}">`);

                    const rawChunks = doc.chunks || [];
                    const sortedChunks = [...rawChunks].sort((a, b) => (a.seq_id || 0) - (b.seq_id || 0));
                    const uniqueChunks = [];
                    const seenSeq = new Set();
                    sortedChunks.forEach(c => {
                        const sid = c.seq_id || 0;
                        if (!seenSeq.has(sid)) {
                            seenSeq.add(sid);
                            uniqueChunks.push(c);
                        }
                    });

                    let prevEndSeq = null;
                    uniqueChunks.forEach(c => {
                        const seq = c.seq_id || 0;
                        if (prevEndSeq === null) {
                            if (seq > 0) {
                                lines.push(`    <gap omitted_chunks="${seq}" from_seq="0" to_seq="${seq - 1}" />`);
                            }
                        } else {
                            const gap = seq - prevEndSeq - 1;
                            if (gap > 0) {
                                lines.push(`    <gap omitted_chunks="${gap}" from_seq="${prevEndSeq + 1}" to_seq="${seq - 1}" />`);
                            }
                        }

                        const rankAttr = c.rank !== undefined && c.rank !== null ? ` rank="${c.rank}"` : '';
                        const scoreAttr = c.score !== undefined && c.score !== null ? ` score="${Number(c.score).toFixed(4)}"` : '';
                        const sectionAttr = c.headers ? ` section="${escapeXmlAttr(c.headers)}"` : '';

                        lines.push(`    <chunk seq="${seq}"${rankAttr}${scoreAttr}${sectionAttr}>`);
                        lines.push((c.text || '').trim());
                        lines.push(`    </chunk>`);
                        prevEndSeq = seq;
                    });

                    lines.push(`  </document>`);
                });

                lines.push('</search_results>');
                return lines.join('\n');
            } else {
                const lines = [`<search_results query="${escapeXmlAttr(query)}" total_matches="${results.length}"${sessionAttr}>`];

                results.forEach((res, i) => {
                    const rank = res.rank !== undefined && res.rank !== null ? res.rank : (i + 1);
                    const scoreStr = res.score !== undefined && res.score !== null ? Number(res.score).toFixed(4) : "0.0000";
                    const seq = res.seq_id || 0;
                    const prevSeq = seq > 0 ? seq - 1 : 0;
                    const nextSeq = seq + 1;
                    const docUri = res.collection ? `qmd://${res.collection}/${res.path}` : res.path;
                    const section = res.headers || "";

                    lines.push(`  <result`);
                    lines.push(`    rank="${rank}"`);
                    lines.push(`    score="${scoreStr}"`);
                    lines.push(`    document="${escapeXmlAttr(docUri)}"`);
                    lines.push(`    seq="${seq}"`);
                    lines.push(`    title="${escapeXmlAttr(res.title || '')}"`);
                    lines.push(`    section="${escapeXmlAttr(section)}"`);
                    lines.push(`    prev_seq="${prevSeq}"`);
                    lines.push(`    next_seq="${nextSeq}">`);
                    lines.push((res.text || '').trim());
                    lines.push(`  </result>`);
                });

                lines.push('</search_results>');
                return lines.join('\n');
            }
        }

        // Fetch & Populate Collections
        async function loadCollections() {
            try {
                const res = await fetch('/api/collections');
                const data = await res.json();
                
                const selects = document.querySelectorAll('.collection-select');
                const heroContainer = document.getElementById('hero-collections-container');
                const serpContainer = document.getElementById('serp-collections-container');

                selects.forEach(sel => {
                    sel.innerHTML = '<option value="">All Collections</option>';
                });
                heroContainer.innerHTML = '';
                serpContainer.innerHTML = '';

                data.forEach(c => {
                    selects.forEach(sel => {
                        const opt = document.createElement('option');
                        opt.value = c.name;
                        opt.textContent = c.name;
                        sel.appendChild(opt);
                    });

                    // Update button
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = "bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 py-1 px-2.5 rounded-md flex items-center gap-1 transition text-xs";
                    btn.innerHTML = `<svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> ${escapeHtml(c.name)}`;
                    btn.onclick = () => updateCollection(c.name, btn);
                    
                    heroContainer.appendChild(btn.cloneNode(true));
                    serpContainer.appendChild(btn);
                });
            } catch(e) {
                console.error("Failed to load collections", e);
            }
        }

        async function updateCollection(name, btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `Updating...`;
            btn.disabled = true;
            try {
                const res = await fetch('/api/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ collection: name, force: false })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    btn.classList.add('border-emerald-500', 'text-emerald-400');
                    setTimeout(() => btn.classList.remove('border-emerald-500', 'text-emerald-400'), 2000);
                } else {
                    alert(data.message);
                }
            } catch(e) {
                alert("Update failed.");
            }
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        }

        // Search Form Execution
        async function handleFormSubmit(e, source) {
            e.preventDefault();
            syncInputs(source);
            
            const query = document.getElementById(`${source}-query`).value.trim();
            if (!query) return;

            setAppState('serp');

            const resultsEl = document.getElementById('results');
            const statsEl = document.getElementById('result-stats');
            const toolbarEl = document.getElementById('results-toolbar');

            resultsEl.innerHTML = `
                <div class="flex items-center justify-center py-20 text-slate-500 gap-3">
                    <svg class="animate-spin h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                    <span>Searching knowledge base...</span>
                </div>
            `;
            toolbarEl.classList.add('hidden');

            try {
                if (activeMode === 'grep') {
                    const payload = {
                        pattern: query,
                        regex: document.getElementById('serp-grep-regex').checked,
                        case_sensitive: document.getElementById('serp-grep-case').checked,
                        limit: parseInt(document.getElementById('serp-limit').value) || 50,
                        collection: document.getElementById('serp-collection-filter').value || null,
                        path: document.getElementById('serp-path').value.trim() || null
                    };

                    const res = await fetch('/api/grep', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Grep failed");

                    lastRawJson = data.results;
                    lastSearchType = 'grep';
                    const timeStr = data.time_taken !== undefined ? ` (${data.time_taken}s)` : '';
                    statsEl.innerHTML = `Found <span class="text-slate-200 font-semibold">${data.total_matches}</span> grep matches${timeStr}`;
                    toolbarEl.classList.remove('hidden');
                    renderResults(data.results, 'grep', query);
                } else {
                    const isDocView = activeMode === 'doc';
                    const payload = {
                        query: query,
                        doc: isDocView,
                        rerank: document.getElementById('serp-rerank').checked,
                        exclude_seen: document.getElementById('serp-exclude-seen').checked,
                        redact_pii: document.getElementById('serp-redact-pii').checked,
                        limit: parseInt(document.getElementById('serp-limit').value) || 10,
                        collection: document.getElementById('serp-collection-filter').value || null,
                        lex: document.getElementById('serp-lex').value.trim() || null,
                        title: document.getElementById('serp-title').value.trim() || null,
                        path: document.getElementById('serp-path').value.trim() || null,
                        session_id: currentSessionId
                    };

                    const res = await fetch('/api/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Search failed");

                    lastRawJson = data.results;
                    lastSearchType = data.type;
                    currentSessionId = data.session_id;

                    document.querySelectorAll('.session-id-val').forEach(el => el.textContent = currentSessionId);

                    const timeStr = data.time_taken !== undefined ? ` (${data.time_taken}s)` : '';
                    const excludedMsg = data.excluded_count ? ` <span class="text-slate-500">•</span> Excluded <span class="text-amber-400 font-semibold">${data.excluded_count}</span> seen chunk(s)` : '';
                    statsEl.innerHTML = `Found <span class="text-slate-200 font-semibold">${data.results.length}</span> ${data.type === 'doc' ? 'documents' : 'chunks'}${timeStr}${excludedMsg}`;
                    toolbarEl.classList.remove('hidden');

                    renderResults(data.results, data.type, query);
                }
            } catch (err) {
                resultsEl.innerHTML = `
                    <div class="bg-red-950/40 border border-red-900/60 rounded-xl p-5 text-red-300 text-sm">
                        <div class="font-semibold mb-1">Search Execution Error</div>
                        <div class="font-mono text-xs text-red-400">${escapeHtml(err.message)}</div>
                    </div>
                `;
            }
        }

        // Render SERP Result Cards
        function renderResults(results, type, query) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (!results || results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-500">
                        <div class="text-base font-medium text-slate-400 mb-1">No matches found</div>
                        <div class="text-xs">Try broader search terms, clearing filters, or switching modes.</div>
                    </div>
                `;
                return;
            }

            // GREP MODE RENDERING
            if (type === 'grep') {
                const grouped = {};
                results.forEach(m => {
                    const key = (m.collection || '') + '/' + m.path;
                    if (!grouped[key]) {
                        grouped[key] = {
                            collection: m.collection,
                            path: m.path,
                            title: m.title,
                            matches: []
                        };
                    }
                    grouped[key].matches.push(m);
                });

                Object.values(grouped).forEach((doc, idx) => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-sm hover:border-slate-700 transition";
                    const uri = doc.collection ? `qmd://${doc.collection}/${doc.path}` : doc.path;

                    card.innerHTML = `
                        <!-- Breadcrumb & Header -->
                        <div class="flex items-center justify-between gap-2 text-xs font-mono text-slate-400 mb-1">
                            <span class="text-blue-400/90 truncate">${escapeHtml(uri)}</span>
                            <span class="bg-slate-950 border border-slate-800 text-amber-400 px-2 py-0.5 rounded font-mono text-[11px]">${doc.matches.length} match(es)</span>
                        </div>
                        <h3 class="text-base font-semibold text-blue-400 hover:text-blue-300 hover:underline cursor-pointer mb-3" onclick="openDocument('${escapeXmlAttr(doc.collection)}', '${escapeXmlAttr(doc.path)}', '')">
                            ${escapeHtml(doc.title || doc.path)}
                        </h3>
                        
                        <!-- Line Matches List -->
                        <div class="space-y-1 font-mono text-xs bg-slate-950/70 p-3 rounded-lg border border-slate-900">
                            ${doc.matches.map(m => `
                                <div class="flex items-start gap-3 hover:bg-slate-800/60 p-1 rounded cursor-pointer transition select-none group" onclick="openDocument('${escapeXmlAttr(m.collection)}', '${escapeXmlAttr(m.path)}', '${escapeXmlAttr(m.line_text)}')">
                                    <span class="text-sky-400 font-semibold w-12 text-right flex-shrink-0 group-hover:text-sky-300">L${m.line_number}:</span>
                                    <span class="text-slate-200 break-all">${highlightKeywords(escapeHtml(m.line_text), query)}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(card);
                });
                return;
            }

            // CHUNK & DOCUMENT SERP RESULT RENDERING
            results.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/80 border border-slate-800/90 rounded-2xl p-5 shadow-sm hover:border-slate-700 transition";

                const uri = item.collection ? `qmd://${item.collection}/${item.path}` : item.path;
                const section = item.headers || "";

                if (type === 'doc') {
                    // Document-level card
                    const snippets = item.snippets || [];
                    card.innerHTML = `
                        <!-- SERP Breadcrumbs URI -->
                        <div class="flex items-center gap-1.5 text-xs text-slate-400 font-mono mb-1.5">
                            <span class="text-blue-400/90 font-medium">${escapeHtml(uri)}</span>
                        </div>

                        <!-- SERP Clickable Blue Title -->
                        <h3 class="text-xl font-semibold text-blue-400 hover:text-blue-300 hover:underline cursor-pointer mb-3" onclick="openDocument('${escapeXmlAttr(item.collection)}', '${escapeXmlAttr(item.path)}', '')">
                            ${escapeHtml(item.title || item.path)}
                        </h3>

                        <!-- Snippets List -->
                        <div class="space-y-3 my-3">
                            ${snippets.map((snip) => `
                                <div class="cursor-pointer bg-slate-950/60 hover:bg-slate-950 p-4 rounded-xl border border-slate-800/80 hover:border-slate-700 transition text-sm text-slate-300 leading-relaxed" onclick="openDocument('${escapeXmlAttr(item.collection)}', '${escapeXmlAttr(item.path)}', '${escapeXmlAttr(snip)}')">
                                    <div class="prose prose-invert max-w-none text-xs text-slate-300">
                                        ${marked.parse(snip)}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Metadata & Quick Action Footer -->
                        <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-800/80 text-xs font-mono text-slate-400">
                            <div class="flex items-center gap-2">
                                <span class="bg-slate-950 px-2.5 py-0.5 rounded border border-slate-800 text-slate-300">Score: ${Number(item.score || 0).toFixed(4)}</span>
                                <span class="bg-slate-950 px-2.5 py-0.5 rounded border border-slate-800 text-slate-400">${snippets.length} snippet(s)</span>
                                ${item.source ? `<span class="text-slate-500 uppercase text-[10px] tracking-wider font-sans">${escapeHtml(item.source)}</span>` : ''}
                            </div>
                            <div class="flex items-center gap-2 font-sans">
                                <button type="button" onclick="openDocument('${escapeXmlAttr(item.collection)}', '${escapeXmlAttr(item.path)}', '')" class="hover:bg-slate-800 px-2.5 py-1 rounded text-blue-400 hover:text-blue-300 transition flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                    Open Doc
                                </button>
                                <button type="button" onclick="copySingleXml(${index})" class="hover:bg-slate-800 px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 transition">
                                    XML
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    // Chunk-level result card
                    card.innerHTML = `
                        <!-- SERP Breadcrumbs URI -->
                        <div class="flex items-center gap-1.5 text-xs text-slate-400 font-mono mb-1.5">
                            <span class="text-blue-400/90 font-medium">${escapeHtml(uri)}</span>
                            ${section ? `<span class="text-slate-600">›</span><span class="text-slate-400 truncate">${escapeHtml(section)}</span>` : ''}
                        </div>

                        <!-- SERP Clickable Blue Title -->
                        <h3 class="text-xl font-semibold text-blue-400 hover:text-blue-300 hover:underline cursor-pointer mb-2.5" onclick="openDocument('${escapeXmlAttr(item.collection)}', '${escapeXmlAttr(item.path)}', '${escapeXmlAttr(item.text)}')">
                            ${escapeHtml(item.title || item.path)}
                        </h3>

                        <!-- Formatted Markdown Snippet -->
                        <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 my-3 text-sm text-slate-300 leading-relaxed cursor-pointer hover:border-slate-700 transition" onclick="openDocument('${escapeXmlAttr(item.collection)}', '${escapeXmlAttr(item.path)}', '${escapeXmlAttr(item.text)}')">
                            <div class="prose prose-invert max-w-none text-xs text-slate-300">
                                ${marked.parse(item.text || '')}
                            </div>
                        </div>

                        <!-- Metadata & Quick Action Footer -->
                        <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-800/80 text-xs font-mono text-slate-400">
                            <div class="flex items-center gap-2">
                                <span class="bg-slate-950 px-2.5 py-0.5 rounded border border-slate-800 text-slate-300">Score: ${Number(item.score || 0).toFixed(4)}</span>
                                ${item.rank ? `<span class="bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-slate-400">#${item.rank}</span>` : ''}
                                ${item.seq_id !== undefined ? `<span class="bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-slate-400">seq: ${item.seq_id}</span>` : ''}
                                ${item.source ? `<span class="text-slate-500 uppercase text-[10px] tracking-wider font-sans">${escapeHtml(item.source)}</span>` : ''}
                            </div>
                            <div class="flex items-center gap-2 font-sans">
                                <button type="button" onclick="openDocument('${escapeXmlAttr(item.collection)}', '${escapeXmlAttr(item.path)}', '${escapeXmlAttr(item.text)}')" class="hover:bg-slate-800 px-2.5 py-1 rounded text-blue-400 hover:text-blue-300 transition flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                    Open Doc
                                </button>
                                <button type="button" onclick="copySingleXml(${index})" class="hover:bg-slate-800 px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 transition">
                                    XML
                                </button>
                            </div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        // Single XML Copy Helper
        function copySingleXml(index) {
            if (!lastRawJson || !lastRawJson[index]) return;
            const item = lastRawJson[index];
            const xml = formatResultsToXml([item], lastSearchType, document.getElementById('serp-query').value, currentSessionId);
            navigator.clipboard.writeText(xml).then(() => {
                alert("Copied XML for item to clipboard!");
            });
        }

        // Copy XML / Prompt Toolbar Handlers
        document.getElementById('copy-json').addEventListener('click', (e) => {
            if (!lastRawJson) return;
            const query = document.getElementById('serp-query').value;
            const xmlData = formatResultsToXml(lastRawJson, lastSearchType, query, currentSessionId);
            navigator.clipboard.writeText(xmlData).then(() => {
                const btn = e.currentTarget;
                const orig = btn.innerHTML;
                btn.innerHTML = `<span class="text-emerald-400 font-semibold">Copied XML!</span>`;
                setTimeout(() => btn.innerHTML = orig, 2000);
            });
        });

        document.getElementById('copy-prompt').addEventListener('click', (e) => {
            if (!lastRawJson) return;
            const query = document.getElementById('serp-query').value;
            const xmlData = formatResultsToXml(lastRawJson, lastSearchType, query, currentSessionId);
            const payload = `Task / Question: ${query}\n\nContext / References:\n${xmlData}`;
            navigator.clipboard.writeText(payload).then(() => {
                const btn = e.currentTarget;
                const orig = btn.innerHTML;
                btn.innerHTML = `<span class="text-white font-semibold">Copied!</span>`;
                setTimeout(() => btn.innerHTML = orig, 2000);
            });
        });

        // Slide-Over Document Viewer Logic
        async function openDocument(collection, path, targetText) {
            const slideOver = document.getElementById('slide-over');
            const backdrop = document.getElementById('slide-backdrop');
            const panel = document.getElementById('slide-panel');
            const contentEl = document.getElementById('slide-content');
            const titleEl = document.getElementById('slide-title');
            const uriEl = document.getElementById('slide-uri');

            contentEl.innerHTML = '<div class="text-center text-slate-500 py-16">Loading document...</div>';
            uriEl.textContent = collection ? `qmd://${collection}/${path}` : path;
            
            slideOver.classList.remove('hidden');
            void slideOver.offsetWidth;
            backdrop.classList.remove('opacity-0');
            panel.classList.remove('translate-x-full');

            const redactPii = document.getElementById('serp-redact-pii').checked;
            try {
                const res = await fetch(`/api/document?collection=${encodeURIComponent(collection)}&path=${encodeURIComponent(path)}${redactPii ? '&redact_pii=true' : ''}`);
                if (!res.ok) throw new Error("Document not found or error loading.");
                const data = await res.json();

                titleEl.textContent = data.title || path;
                let rawMd = data.content;
                
                if (targetText && targetText.length > 10) {
                    let searchStr = targetText.trim();
                    let index = rawMd.indexOf(searchStr);
                    if (index === -1) {
                        index = rawMd.indexOf(searchStr.substring(0, 40));
                    }
                    if (index !== -1) {
                        const remainder = rawMd.substring(index);
                        const match = remainder.match(/[a-zA-Z0-9]/);
                        const offset = match ? match.index : 0;
                        rawMd = rawMd.substring(0, index + offset) + 
                                '<span id="scroll-target"></span>' + 
                                rawMd.substring(index + offset);
                    }
                }

                marked.setOptions({ gfm: true, breaks: true });
                contentEl.innerHTML = marked.parse(rawMd);

                setTimeout(() => {
                    const targetSpan = document.getElementById('scroll-target');
                    if (targetSpan) {
                        targetSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        const parent = targetSpan.parentElement;
                        if (parent) {
                            const originalBg = parent.style.backgroundColor;
                            const originalTransition = parent.style.transition;
                            parent.style.transition = 'background-color 0.5s ease-out';
                            parent.style.backgroundColor = 'rgba(59, 130, 246, 0.3)';
                            setTimeout(() => { 
                                parent.style.backgroundColor = originalBg; 
                                setTimeout(() => { parent.style.transition = originalTransition; }, 500);
                            }, 1500);
                        }
                    }
                }, 300);
            } catch (err) {
                contentEl.innerHTML = `<div class="text-red-400 p-4">Failed to load document: ${escapeHtml(err.message)}</div>`;
            }
        }

        function closeDocument() {
            const backdrop = document.getElementById('slide-backdrop');
            const panel = document.getElementById('slide-panel');
            backdrop.classList.add('opacity-0');
            panel.classList.add('translate-x-full');
            setTimeout(() => {
                document.getElementById('slide-over').classList.add('hidden');
                document.getElementById('slide-content').innerHTML = '';
            }, 300);
        }

        document.getElementById('close-slide').addEventListener('click', closeDocument);
        document.getElementById('slide-backdrop').addEventListener('click', closeDocument);

        // Collection File Tree Drawer Logic
        async function loadCollectionTree(pattern = '') {
            const container = document.getElementById('tree-content');
            container.innerHTML = '<div class="text-slate-500 py-6 text-center">Loading tree...</div>';
            try {
                const url = pattern ? `/api/collections/tree?pattern=${encodeURIComponent(pattern)}` : '/api/collections/tree';
                const res = await fetch(url);
                if (!res.ok) throw new Error("Failed to load collection tree");
                const data = await res.json();
                renderCollectionTree(data);
            } catch (err) {
                container.innerHTML = `<div class="text-red-400 p-2">Error: ${escapeHtml(err.message)}</div>`;
            }
        }

        function renderCollectionTree(treeData) {
            const container = document.getElementById('tree-content');
            container.innerHTML = '';

            const collections = Array.isArray(treeData) ? treeData : [treeData];
            if (collections.length === 0) {
                container.innerHTML = '<div class="text-slate-500 py-6 text-center">No indexed documents found.</div>';
                return;
            }

            collections.forEach(item => {
                const collDiv = document.createElement('div');
                collDiv.className = "bg-slate-950/60 rounded-xl p-3 border border-slate-800/80";

                const collTitle = document.createElement('div');
                collTitle.className = "font-bold text-blue-400 flex items-center gap-1.5 pb-2 border-b border-slate-800/80 mb-2";
                collTitle.innerHTML = `<svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg> ${escapeHtml(item.collection)}/`;
                collDiv.appendChild(collTitle);

                const treeContainer = document.createElement('div');
                treeContainer.className = "pl-1 space-y-1";

                function renderNode(node, parentEl, collName) {
                    const children = node.children || [];
                    children.forEach(child => {
                        const row = document.createElement('div');
                        if (child.type === 'directory') {
                            row.className = "space-y-1";
                            const dirHeader = document.createElement('div');
                            dirHeader.className = "flex items-center gap-1 text-amber-400 font-semibold cursor-pointer hover:text-amber-300 select-none py-0.5";
                            dirHeader.innerHTML = `
                                <svg class="w-3 h-3 transform transition-transform text-slate-500 dir-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                <svg class="w-3.5 h-3.5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                                <span>${escapeHtml(child.name)}/</span>
                            `;
                            const childContainer = document.createElement('div');
                            childContainer.className = "pl-3.5 border-l border-slate-800 ml-1.5 space-y-1";

                            dirHeader.onclick = () => {
                                childContainer.classList.toggle('hidden');
                                dirHeader.querySelector('.dir-chevron').classList.toggle('-rotate-90');
                            };

                            row.appendChild(dirHeader);
                            renderNode(child, childContainer, collName);
                            row.appendChild(childContainer);
                        } else {
                            row.className = "flex items-center gap-1.5 text-slate-300 hover:text-blue-300 hover:bg-slate-800/50 px-2 py-1 rounded cursor-pointer transition select-none group";
                            const titleStr = child.title && child.title !== child.name ? `<span class="text-slate-500 text-[10px] group-hover:text-slate-400 truncate">(${escapeHtml(child.title)})</span>` : '';
                            row.innerHTML = `
                                <svg class="w-3.5 h-3.5 text-slate-500 group-hover:text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                <span class="truncate">${escapeHtml(child.name)}</span>
                                ${titleStr}
                            `;
                            row.onclick = () => openDocument(collName, child.path, '');
                        }
                        parentEl.appendChild(row);
                    });
                }

                renderNode(item.tree || {}, treeContainer, item.collection);
                collDiv.appendChild(treeContainer);
                container.appendChild(collDiv);
            });
        }

        function openTreeDrawer() {
            const drawer = document.getElementById('tree-drawer');
            const backdrop = document.getElementById('tree-backdrop');
            const panel = document.getElementById('tree-panel');

            drawer.classList.remove('hidden');
            void drawer.offsetWidth;
            backdrop.classList.remove('opacity-0');
            panel.classList.remove('-translate-x-full');

            loadCollectionTree();
        }

        function closeTreeDrawer() {
            const backdrop = document.getElementById('tree-backdrop');
            const panel = document.getElementById('tree-panel');
            backdrop.classList.add('opacity-0');
            panel.classList.add('-translate-x-full');
            setTimeout(() => {
                document.getElementById('tree-drawer').classList.add('hidden');
            }, 300);
        }

        document.querySelectorAll('.btn-open-tree').forEach(btn => {
            btn.addEventListener('click', openTreeDrawer);
        });
        document.getElementById('close-tree').addEventListener('click', closeTreeDrawer);
        document.getElementById('tree-backdrop').addEventListener('click', closeTreeDrawer);
        document.getElementById('refresh-tree').addEventListener('click', () => {
            const val = document.getElementById('tree-filter-input').value.trim();
            loadCollectionTree(val);
        });

        document.getElementById('tree-filter-input').addEventListener('input', (e) => {
            clearTimeout(treeFilterTimer);
            const val = e.target.value.trim();
            treeFilterTimer = setTimeout(() => loadCollectionTree(val), 250);
        });

        // Global Escape Key Listener
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!document.getElementById('slide-over').classList.contains('hidden')) {
                    closeDocument();
                } else if (!document.getElementById('tree-drawer').classList.contains('hidden')) {
                    closeTreeDrawer();
                }
            }
        });

        // Initialize on load
        loadCollections();
    </script>
</body>
</html>
