<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMD Web Search</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom styling for rendered markdown content */
        .prose pre { background-color: #1f2937; padding: 1rem; border-radius: 0.375rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem;}
        .prose code { font-family: monospace; color: #a5b4fc; }
        .prose p { margin-bottom: 0.75rem; }
        .prose h1, .prose h2, .prose h3 { font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #f3f4f6; }
        .prose a { color: #60a5fa; text-decoration: underline; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem;}
        .prose table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; text-align: left; }
        .prose th, .prose td { border: 1px solid #4b5563; padding: 0.5rem; }
        .prose th { background-color: #374151; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen p-8">
    <div class="max-w-5xl mx-auto space-y-8">
        
        <div class="flex justify-between items-end border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                    QMD Web Search
                    <span id="session-badge" class="text-xs font-mono bg-gray-800 border border-gray-700 px-2 py-1 rounded text-gray-400 font-normal">Session: -</span>
                </h1>
                <p class="text-gray-400 mt-1 text-sm">Semantic & FTS Local Knowledge Base</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-toggle-tree" class="text-xs bg-gray-800 border border-blue-500/60 hover:border-blue-400 text-blue-300 py-1 px-3 rounded flex items-center gap-1.5 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    File Tree
                </button>
                <div id="collections-container" class="flex gap-2">
                </div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <form id="search-form" class="space-y-4">
                <div class="flex gap-4">
                    <input type="text" id="query" class="flex-1 bg-gray-700 text-white rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Search your knowledge base..." required>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-md transition duration-150">Search</button>
                </div>
                
                <div class="flex flex-wrap gap-4 text-sm mt-4 items-center">
                    <label class="flex items-center gap-1">
                        <input type="checkbox" id="doc-view" class="rounded bg-gray-700" checked>
                        <span>Document View</span>
                    </label>
                    <label class="flex items-center gap-1">
                        <input type="checkbox" id="rerank" class="rounded bg-gray-700">
                        <span>Rerank</span>
                    </label>
                    <label class="flex items-center gap-1">
                        <input type="checkbox" id="exclude-seen" class="rounded bg-gray-700">
                        <span>Exclude Seen</span>
                    </label>
                    <label class="flex items-center gap-1">
                        <input type="checkbox" id="redact-pii" class="rounded bg-gray-700">
                        <span>Redact PII</span>
                    </label>
                    <div class="flex items-center gap-2 border-l border-gray-600 pl-4">
                        <span>Limit:</span>
                        <input type="number" id="limit" value="10" class="w-16 bg-gray-700 rounded px-2 py-1 text-center">
                    </div>
                    <div class="flex items-center gap-2">
                        <span>Collection:</span>
                        <select id="collection-filter" class="bg-gray-700 rounded px-2 py-1">
                            <option value="">All</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="button" id="toggle-advanced" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1 transition">
                        <svg class="w-3 h-3 transition-transform" id="advanced-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        Advanced Options
                    </button>
                </div>
                
                <div id="advanced-options" class="hidden mt-4 pt-4 border-t border-gray-700 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Lexical Override (FTS)</label>
                        <input type="text" id="lex" class="w-full bg-gray-700 text-white text-sm rounded px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="e.g. strict exact terms">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Title Filter</label>
                        <input type="text" id="title" class="w-full bg-gray-700 text-white text-sm rounded px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="e.g. config">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Path Filter</label>
                        <input type="text" id="path" class="w-full bg-gray-700 text-white text-sm rounded px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="e.g. src/utils">
                    </div>
                </div>
            </form>
        </div>

        <div class="flex justify-between items-center hidden" id="results-toolbar">
            <span class="text-gray-400 text-sm" id="result-stats"></span>
            <div class="flex gap-2">
                <button id="copy-json" class="bg-gray-700 hover:bg-gray-600 text-sm py-1 px-4 rounded transition">
                    Copy XML for LLM
                </button>
                <button id="copy-prompt" class="bg-blue-600 hover:bg-blue-500 text-white text-sm py-1 px-4 rounded transition">
                    Copy Question & References
                </button>
            </div>
        </div>

        <div id="results" class="space-y-6 pb-20">
            </div>

    </div>

    <!-- Collection Tree Drawer -->
    <div id="tree-drawer" class="fixed inset-0 overflow-hidden z-40 pointer-events-none hidden">
        <div class="absolute inset-0 overflow-hidden">
            <div id="tree-backdrop" class="absolute inset-0 bg-gray-900 bg-opacity-75 transition-opacity opacity-0 pointer-events-auto duration-300"></div>
            <div class="fixed inset-y-0 left-0 max-w-md w-full flex">
                <div id="tree-panel" class="w-full bg-gray-900 border-r border-gray-700 shadow-2xl transform transition-transform -translate-x-full pointer-events-auto flex flex-col duration-300">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700 bg-gray-800">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            <h2 class="text-lg font-semibold text-white">Collection Files</h2>
                        </div>
                        <button id="close-tree" class="text-gray-400 hover:text-white transition focus:outline-none">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    <div class="px-6 py-2.5 border-b border-gray-700 bg-gray-800/50 flex items-center justify-between text-xs text-gray-400">
                        <span>Directory Tree</span>
                        <button id="refresh-tree" class="hover:text-blue-400 flex items-center gap-1 transition">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Refresh
                        </button>
                    </div>
                    <div id="tree-content" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs font-mono">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="slide-over" class="fixed inset-0 overflow-hidden z-50 pointer-events-none hidden">
        <div class="absolute inset-0 overflow-hidden">
            <div id="slide-backdrop" class="absolute inset-0 bg-gray-900 bg-opacity-75 transition-opacity opacity-0 pointer-events-auto duration-300"></div>
            <div class="fixed inset-y-0 right-0 max-w-3xl w-full flex">
                <div id="slide-panel" class="w-full bg-gray-900 border-l border-gray-700 shadow-2xl transform transition-transform translate-x-full pointer-events-auto flex flex-col duration-300">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700 bg-gray-800">
                        <h2 id="slide-title" class="text-xl font-semibold text-white truncate">Document Title</h2>
                        <button id="close-slide" class="text-gray-400 hover:text-white transition focus:outline-none">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    <div id="slide-content" class="flex-1 overflow-y-auto p-8 prose prose-invert max-w-none">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lastRawJson = null;
        let lastSearchType = 'doc';
        let currentSessionId = null;

        function escapeXmlAttr(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function formatResultsToXml(results, type, query, sessionId) {
            if (!results || results.length === 0) {
                return `<search_results query="${escapeXmlAttr(query)}" total_matches="0">\n</search_results>`;
            }

            const sessionAttr = sessionId ? ` session_id="${escapeXmlAttr(sessionId)}"` : '';

            if (type === 'doc') {
                const totalMatches = results.reduce((acc, doc) => acc + (doc.chunks ? doc.chunks.length : 0), 0);
                const lines = [`<search_results query="${escapeXmlAttr(query)}" total_matches="${totalMatches}" total_documents="${results.length}"${sessionAttr}>`];

                results.forEach(doc => {
                    const uri = doc.collection ? `qmd://${doc.collection}/${doc.path}` : (doc.path || '');
                    lines.push(`  <document uri="${escapeXmlAttr(uri)}" title="${escapeXmlAttr(doc.title || '')}">`);

                    const rawChunks = doc.chunks || [];
                    const sortedChunks = [...rawChunks].sort((a, b) => (a.seq_id || 0) - (b.seq_id || 0));

                    const uniqueChunks = [];
                    const seenSeq = new Set();
                    sortedChunks.forEach(c => {
                        const sid = c.seq_id || 0;
                        if (!seenSeq.has(sid)) {
                            seenSeq.add(sid);
                            uniqueChunks.push(c);
                        }
                    });

                    let prevEndSeq = null;
                    uniqueChunks.forEach(c => {
                        const seq = c.seq_id || 0;
                        if (prevEndSeq === null) {
                            if (seq > 0) {
                                lines.push(`    <gap omitted_chunks="${seq}" from_seq="0" to_seq="${seq - 1}" />`);
                            }
                        } else {
                            const gap = seq - prevEndSeq - 1;
                            if (gap > 0) {
                                lines.push(`    <gap omitted_chunks="${gap}" from_seq="${prevEndSeq + 1}" to_seq="${seq - 1}" />`);
                            }
                        }

                        const rankAttr = c.rank !== undefined && c.rank !== null ? ` rank="${c.rank}"` : '';
                        const scoreAttr = c.score !== undefined && c.score !== null ? ` score="${Number(c.score).toFixed(4)}"` : '';
                        const sectionAttr = c.headers ? ` section="${escapeXmlAttr(c.headers)}"` : '';

                        lines.push(`    <chunk seq="${seq}"${rankAttr}${scoreAttr}${sectionAttr}>`);
                        lines.push((c.text || '').trim());
                        lines.push(`    </chunk>`);
                        prevEndSeq = seq;
                    });

                    lines.push(`  </document>`);
                });

                lines.push('</search_results>');
                return lines.join('\n');
            } else {
                const lines = [`<search_results query="${escapeXmlAttr(query)}" total_matches="${results.length}"${sessionAttr}>`];

                results.forEach((res, i) => {
                    const rank = res.rank !== undefined && res.rank !== null ? res.rank : (i + 1);
                    const scoreStr = res.score !== undefined && res.score !== null ? Number(res.score).toFixed(4) : "0.0000";
                    const seq = res.seq_id || 0;
                    const prevSeq = seq > 0 ? seq - 1 : 0;
                    const nextSeq = seq + 1;
                    const docUri = res.collection ? `qmd://${res.collection}/${res.path}` : res.path;
                    const section = res.headers || "";

                    lines.push(`  <result`);
                    lines.push(`    rank="${rank}"`);
                    lines.push(`    score="${scoreStr}"`);
                    lines.push(`    document="${escapeXmlAttr(docUri)}"`);
                    lines.push(`    seq="${seq}"`);
                    lines.push(`    title="${escapeXmlAttr(res.title || '')}"`);
                    lines.push(`    section="${escapeXmlAttr(section)}"`);
                    lines.push(`    prev_seq="${prevSeq}"`);
                    lines.push(`    next_seq="${nextSeq}">`);
                    lines.push((res.text || '').trim());
                    lines.push(`  </result>`);
                });

                lines.push('</search_results>');
                return lines.join('\n');
            }
        }

        // Fetch collections on load
        async function loadCollections() {
            const res = await fetch('/api/collections');
            const data = await res.json();
            
            const filterEl = document.getElementById('collection-filter');
            const containerEl = document.getElementById('collections-container');
            
            data.forEach(c => {
                // Populate dropdown
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = c.name;
                filterEl.appendChild(opt);

                // Populate fast update buttons
                const btn = document.createElement('button');
                btn.className = "text-xs bg-gray-800 border border-gray-600 hover:bg-gray-700 text-gray-300 py-1 px-2 rounded flex items-center gap-1 transition";
                btn.innerHTML = `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> ${c.name}`;
                btn.onclick = () => updateCollection(c.name, btn);
                containerEl.appendChild(btn);
            });
        }

        async function updateCollection(name, btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `Updating...`;
            btn.disabled = true;
            try {
                const res = await fetch('/api/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ collection: name, force: false })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    btn.classList.add('border-green-500', 'text-green-400');
                    setTimeout(() => btn.classList.remove('border-green-500', 'text-green-400'), 2000);
                } else {
                    alert(data.message);
                }
            } catch(e) {
                alert("Update failed.");
            }
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        }

        // Handle Advanced Toggle
        document.getElementById('toggle-advanced').addEventListener('click', () => {
            const panel = document.getElementById('advanced-options');
            const icon = document.getElementById('advanced-icon');
            panel.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        });

        // Handle Form Submission
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultsEl = document.getElementById('results');
            const statsEl = document.getElementById('result-stats');
            const toolbarEl = document.getElementById('results-toolbar');
            
            resultsEl.innerHTML = '<div class="text-center text-gray-500 mt-10">Searching...</div>';
            toolbarEl.classList.add('hidden');

            const payload = {
                query: document.getElementById('query').value,
                doc: document.getElementById('doc-view').checked,
                rerank: document.getElementById('rerank').checked,
                exclude_seen: document.getElementById('exclude-seen').checked,
                redact_pii: document.getElementById('redact-pii').checked,
                limit: parseInt(document.getElementById('limit').value),
                collection: document.getElementById('collection-filter').value,
                lex: document.getElementById('lex').value.trim() || null,
                title: document.getElementById('title').value.trim() || null,
                path: document.getElementById('path').value.trim() || null,
                session_id: currentSessionId
            };

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || "Server returned an error");
                }

                lastRawJson = data.results;
                lastSearchType = data.type;
                currentSessionId = data.session_id;
                document.getElementById('session-badge').textContent = `Session: ${currentSessionId}`;

                const excludedMsg = data.excluded_count ? ` | Excluded ${data.excluded_count} seen chunk(s)` : '';
                statsEl.textContent = `Found ${data.results.length} ${data.type === 'doc' ? 'documents' : 'chunks'}${excludedMsg}.`;
                toolbarEl.classList.remove('hidden');
                
                renderResults(data.results, data.type);
            } catch (err) {
                resultsEl.innerHTML = `<div class="text-red-400 mt-10 text-center font-mono bg-gray-800 p-4 rounded border border-red-900 shadow-md">Error executing search:<br>${err.message}</div>`;
            }
        });

        // Copy XML logic
        document.getElementById('copy-json').addEventListener('click', (e) => {
            if(!lastRawJson) return;
            const query = document.getElementById('query').value;
            const xmlData = formatResultsToXml(lastRawJson, lastSearchType, query, currentSessionId);
            navigator.clipboard.writeText(xmlData).then(() => {
                const btn = e.target;
                const originalText = btn.textContent;
                btn.textContent = "Copied XML!";
                btn.classList.add("bg-green-600", "text-white");
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove("bg-green-600", "text-white");
                }, 2000);
            });
        });

        // Copy Prompt + References logic
        document.getElementById('copy-prompt').addEventListener('click', (e) => {
            if(!lastRawJson) return;
            const query = document.getElementById('query').value;
            const xmlData = formatResultsToXml(lastRawJson, lastSearchType, query, currentSessionId);
            const payload = `Task / Question: ${query}\n\nContext / References:\n${xmlData}`;
            
            navigator.clipboard.writeText(payload).then(() => {
                const btn = e.target;
                const originalText = btn.textContent;
                btn.textContent = "Copied!";
                btn.classList.replace("bg-blue-600", "bg-green-600");
                btn.classList.replace("hover:bg-blue-500", "hover:bg-green-500");
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.replace("bg-green-600", "bg-blue-600");
                    btn.classList.replace("hover:bg-green-500", "hover:bg-blue-500");
                }, 2000);
            });
        });

        function renderResults(results, type) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = '<div class="text-gray-500 italic mt-4">No results found.</div>';
                return;
            }

            results.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = type === 'doc' 
                    ? "bg-gray-800 rounded-lg p-6 border border-gray-700 shadow-md" 
                    : "bg-gray-800 rounded-lg p-6 border border-gray-700 shadow-md cursor-pointer hover:border-blue-500 transition duration-200 group";
                
                if (type !== 'doc') {
                    card.onclick = () => openDocument(item.collection, item.path, item.text);
                }

                const header = document.createElement('div');
                header.className = "flex justify-between items-start border-b border-gray-700 pb-3 mb-4";
                
                const pathStr = item.collection ? `qmd://${item.collection}/${item.path}` : item.path;
                
                const titleClass = type === 'doc' 
                    ? "text-lg font-semibold text-blue-400 hover:text-blue-300 transition flex items-center gap-2 cursor-pointer" 
                    : "text-lg font-semibold text-blue-400 group-hover:text-blue-300 transition flex items-center gap-2";
                
                header.innerHTML = `
                    <div>
                        <h3 class="${titleClass}" ${type === 'doc' ? `onclick="openDocument('${item.collection}', '${item.path}', '')"` : ''}>
                            <span class="text-gray-500 text-sm font-mono">#${index + 1}</span> 
                            ${item.title}
                        </h3>
                        <p class="text-xs text-gray-400 font-mono mt-1">${pathStr}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-mono bg-gray-900 px-2 py-1 rounded text-gray-300">Score: ${item.score.toFixed(4)}</span>
                        ${item.source ? `<div class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">${item.source}</div>` : ''}
                    </div>
                `;
                card.appendChild(header);

                const body = document.createElement('div');
                body.className = "prose prose-invert max-w-none text-sm text-gray-300";
                
                if (type === 'doc') {
                    // Document view: make individual snippets clickable
                    item.snippets.forEach((snip, i) => {
                        const snipDiv = document.createElement('div');
                        snipDiv.className = "cursor-pointer hover:bg-gray-700/30 p-3 -mx-3 rounded transition border border-transparent hover:border-gray-600";
                        snipDiv.onclick = (e) => {
                            e.stopPropagation();
                            openDocument(item.collection, item.path, snip);
                        };
                        snipDiv.innerHTML = marked.parse(snip);
                        body.appendChild(snipDiv);
                        
                        if (i < item.snippets.length - 1) {
                            const hr = document.createElement('hr');
                            hr.className = "border-gray-700 my-4 border-dashed";
                            body.appendChild(hr);
                        }
                    });
                } else {
                    // Chunk view
                    body.innerHTML = marked.parse(item.text);
                }

                card.appendChild(body);
                container.appendChild(card);
            });
        }

        // Document Viewer Logic
        async function openDocument(collection, path, targetText) {
            const slideOver = document.getElementById('slide-over');
            const backdrop = document.getElementById('slide-backdrop');
            const panel = document.getElementById('slide-panel');
            const contentEl = document.getElementById('slide-content');
            const titleEl = document.getElementById('slide-title');

            contentEl.innerHTML = '<div class="text-center text-gray-500 mt-10">Loading document...</div>';
            
            // Unhide container and trigger reflow
            slideOver.classList.remove('hidden');
            void slideOver.offsetWidth; 
            
            // Animate in
            backdrop.classList.remove('opacity-0');
            panel.classList.remove('translate-x-full');

            const redactPii = document.getElementById('redact-pii').checked;
            try {
                const res = await fetch(`/api/document?collection=${encodeURIComponent(collection)}&path=${encodeURIComponent(path)}${redactPii ? '&redact_pii=true' : ''}`);
                if (!res.ok) throw new Error("Document not found or error loading.");
                const data = await res.json();

                titleEl.textContent = data.title || path;

                let rawMd = data.content;
                
                if (targetText && targetText.length > 10) {
                    let searchStr = targetText.trim();
                    let index = rawMd.indexOf(searchStr);
                    
                    if (index === -1) {
                        // Fallback: Try matching first 40 chars to avoid whitespace/truncation issues
                        index = rawMd.indexOf(searchStr.substring(0, 40));
                    }
                    
                    if (index !== -1) {
                        // Inject anchor safely AFTER markdown block syntax (like #, -, |)
                        // by finding the first alphanumeric char from the match point.
                        const remainder = rawMd.substring(index);
                        const match = remainder.match(/[a-zA-Z0-9]/);
                        const offset = match ? match.index : 0;
                        
                        rawMd = rawMd.substring(0, index + offset) + 
                                '<span id="scroll-target"></span>' + 
                                rawMd.substring(index + offset);
                    }
                }

                // Ensure tables and breaks are parsed correctly
                marked.setOptions({ gfm: true, breaks: true });
                
                // Render the modified markdown
                contentEl.innerHTML = marked.parse(rawMd);

                // Auto-scroll to the injected anchor
                setTimeout(() => {
                    const targetSpan = document.getElementById('scroll-target');
                    if (targetSpan) {
                        targetSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        
                        // Flash the parent block element (p, td, li, h1, etc)
                        const parent = targetSpan.parentElement;
                        if (parent) {
                            const originalBg = parent.style.backgroundColor;
                            const originalTransition = parent.style.transition;
                            
                            parent.style.transition = 'background-color 0.5s ease-out';
                            parent.style.backgroundColor = 'rgba(59, 130, 246, 0.3)'; // blue-500/30
                            
                            setTimeout(() => { 
                                parent.style.backgroundColor = originalBg; 
                                setTimeout(() => { parent.style.transition = originalTransition; }, 500);
                            }, 1500);
                        }
                    }
                }, 300);

            } catch (err) {
                contentEl.innerHTML = `<div class="text-red-400">Failed to load document: ${err.message}</div>`;
            }
        }

        function closeDocument() {
            const backdrop = document.getElementById('slide-backdrop');
            const panel = document.getElementById('slide-panel');
            
            // Animate out
            backdrop.classList.add('opacity-0');
            panel.classList.add('translate-x-full');
            
            setTimeout(() => {
                document.getElementById('slide-over').classList.add('hidden');
                document.getElementById('slide-content').innerHTML = ''; // clear memory
            }, 300);
        }

        document.getElementById('close-slide').addEventListener('click', closeDocument);
        document.getElementById('slide-backdrop').addEventListener('click', closeDocument);

        // Collection Tree Viewer Logic
        async function loadCollectionTree() {
            const container = document.getElementById('tree-content');
            container.innerHTML = '<div class="text-gray-500 py-4 text-center">Loading tree...</div>';
            try {
                const res = await fetch('/api/collections/tree');
                if (!res.ok) throw new Error("Failed to load collection tree");
                const data = await res.json();
                renderCollectionTree(data);
            } catch (err) {
                container.innerHTML = `<div class="text-red-400 p-2">Error: ${err.message}</div>`;
            }
        }

        function renderCollectionTree(treeData) {
            const container = document.getElementById('tree-content');
            container.innerHTML = '';

            const collections = Array.isArray(treeData) ? treeData : [treeData];
            if (collections.length === 0) {
                container.innerHTML = '<div class="text-gray-500 py-4 text-center">No indexed documents found.</div>';
                return;
            }

            collections.forEach(item => {
                const collDiv = document.createElement('div');
                collDiv.className = "bg-gray-800/60 rounded p-2.5 border border-gray-700/60";

                const collTitle = document.createElement('div');
                collTitle.className = "font-bold text-blue-400 flex items-center gap-1.5 pb-1.5 border-b border-gray-700/50 mb-2";
                collTitle.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg> ${item.collection}/`;
                collDiv.appendChild(collTitle);

                const rootTree = item.tree || {};
                const treeContainer = document.createElement('div');
                treeContainer.className = "pl-1 space-y-1";

                function renderNode(node, parentEl, collName) {
                    const children = node.children || [];
                    children.forEach(child => {
                        const row = document.createElement('div');
                        if (child.type === 'directory') {
                            row.className = "space-y-1";
                            const dirHeader = document.createElement('div');
                            dirHeader.className = "flex items-center gap-1 text-yellow-400 font-semibold cursor-pointer hover:text-yellow-300 select-none py-0.5";
                            dirHeader.innerHTML = `
                                <svg class="w-3 h-3 transform transition-transform text-gray-400 dir-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                <svg class="w-3.5 h-3.5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                                <span>${child.name}/</span>
                            `;
                            const childContainer = document.createElement('div');
                            childContainer.className = "pl-3.5 border-l border-gray-700/60 ml-1.5 space-y-1";

                            dirHeader.onclick = () => {
                                childContainer.classList.toggle('hidden');
                                dirHeader.querySelector('.dir-chevron').classList.toggle('-rotate-90');
                            };

                            row.appendChild(dirHeader);
                            renderNode(child, childContainer, collName);
                            row.appendChild(childContainer);
                        } else {
                            row.className = "flex items-center gap-1.5 text-gray-300 hover:text-blue-300 hover:bg-gray-700/40 px-1.5 py-0.5 rounded cursor-pointer transition select-none group";
                            const titleStr = child.title && child.title !== child.name ? `<span class="text-gray-500 text-[10px] group-hover:text-gray-400 truncate">(${child.title})</span>` : '';
                            row.innerHTML = `
                                <svg class="w-3 h-3 text-gray-400 group-hover:text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                <span class="truncate">${child.name}</span>
                                ${titleStr}
                            `;
                            row.onclick = () => {
                                openDocument(collName, child.path, '');
                            };
                        }
                        parentEl.appendChild(row);
                    });
                }

                renderNode(rootTree, treeContainer, item.collection);
                collDiv.appendChild(treeContainer);
                container.appendChild(collDiv);
            });
        }

        function openTreeDrawer() {
            const drawer = document.getElementById('tree-drawer');
            const backdrop = document.getElementById('tree-backdrop');
            const panel = document.getElementById('tree-panel');

            drawer.classList.remove('hidden');
            void drawer.offsetWidth;
            backdrop.classList.remove('opacity-0');
            panel.classList.remove('-translate-x-full');

            loadCollectionTree();
        }

        function closeTreeDrawer() {
            const backdrop = document.getElementById('tree-backdrop');
            const panel = document.getElementById('tree-panel');

            backdrop.classList.add('opacity-0');
            panel.classList.add('-translate-x-full');

            setTimeout(() => {
                document.getElementById('tree-drawer').classList.add('hidden');
            }, 300);
        }

        document.getElementById('btn-toggle-tree').addEventListener('click', openTreeDrawer);
        document.getElementById('close-tree').addEventListener('click', closeTreeDrawer);
        document.getElementById('tree-backdrop').addEventListener('click', closeTreeDrawer);
        document.getElementById('refresh-tree').addEventListener('click', loadCollectionTree);

        // Escape key to close open panels
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!document.getElementById('slide-over').classList.contains('hidden')) {
                    closeDocument();
                } else if (!document.getElementById('tree-drawer').classList.contains('hidden')) {
                    closeTreeDrawer();
                }
            }
        });

        // Initialize
        loadCollections();
    </script>
</body>
</html>
