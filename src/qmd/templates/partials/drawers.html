<!-- COLLECTION TREE SLIDE-OVER -->
<div id="tree-drawer" class="fixed inset-0 overflow-hidden z-50 pointer-events-none hidden">
    <div class="absolute inset-0 overflow-hidden">
        <div id="tree-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-[2px] transition-opacity opacity-0 pointer-events-auto duration-200" onclick="closeTreeDrawer()"></div>
        <div class="fixed inset-y-0 left-0 max-w-md w-full flex">
            <div id="tree-panel" class="w-full bg-white dark:bg-[#202124] border-r border-google-border dark:border-google-borderDark shadow-2xl transform transition-transform -translate-x-full pointer-events-auto flex flex-col duration-200">
                <div class="flex items-center justify-between px-5 py-4 border-b border-google-border dark:border-google-borderDark bg-[#f8f9fa] dark:bg-[#282a2d]">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                        <h2 class="text-sm font-semibold text-gray-900 dark:text-white">Corpus Tree Directory</h2>
                    </div>
                    <button type="button" onclick="closeTreeDrawer()" class="p-1 rounded-full text-gray-400 hover:text-gray-600 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-gray-700 transition focus:outline-none">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div class="px-5 py-2.5 border-b border-google-border dark:border-google-borderDark bg-white dark:bg-[#202124] flex flex-col gap-2 text-xs">
                    <input type="text" id="tree-filter-input" placeholder="Filter files (e.g. guide or .md)..." class="w-full bg-gray-50 dark:bg-[#303134] border border-gray-300 dark:border-gray-600 text-[#202124] dark:text-[#e8eaed] rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-blue-500">
                </div>
                <div id="tree-content" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs font-mono"></div>
            </div>
        </div>
    </div>
</div>

<!-- DOCUMENT SLIDE-OVER VIEWER -->
<div id="slide-over" class="fixed inset-0 overflow-hidden z-50 pointer-events-none hidden">
    <div class="absolute inset-0 overflow-hidden">
        <div id="slide-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-[2px] transition-opacity opacity-0 pointer-events-auto duration-200" onclick="closeDocument()"></div>
        <div class="fixed inset-y-0 right-0 max-w-2xl w-full flex">
            <div id="slide-panel" class="w-full bg-white dark:bg-[#202124] border-l border-google-border dark:border-google-borderDark shadow-2xl transform transition-transform translate-x-full pointer-events-auto flex flex-col duration-200">
                <div class="px-5 py-4 border-b border-google-border dark:border-google-borderDark bg-[#f8f9fa] dark:bg-[#282a2d] flex items-center justify-between">
                    <div class="flex flex-col min-w-0 pr-4">
                        <span class="text-[10px] uppercase font-bold tracking-wider text-blue-600 dark:text-blue-400">Document Reader</span>
                        <span id="slide-uri" class="text-xs font-mono text-gray-500 dark:text-gray-400 truncate mt-0.5"></span>
                        <h2 id="slide-title" class="text-base font-semibold text-gray-900 dark:text-white truncate">Document Preview</h2>
                    </div>
                    <button type="button" onclick="closeDocument()" class="p-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 transition focus:outline-none flex-shrink-0">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div id="slide-content" class="flex-1 overflow-y-auto p-6 prose dark:prose-invert max-w-none text-sm text-gray-700 dark:text-gray-300 font-sans leading-relaxed"></div>
                <div class="p-4 border-t border-google-border dark:border-google-borderDark bg-[#f8f9fa] dark:bg-[#282a2d] flex items-center justify-between">
                    <span class="text-xs text-gray-400 font-mono">QMD Inspector</span>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="copyCurrentDocumentContent()" class="px-3 py-1.5 text-xs bg-white dark:bg-[#303134] border border-gray-300 dark:border-gray-600 rounded text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-[#3c4043] font-medium transition">
                            Copy Text
                        </button>
                        <button type="button" onclick="closeDocument()" class="px-3.5 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded font-medium transition shadow-sm">
                            Done
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
