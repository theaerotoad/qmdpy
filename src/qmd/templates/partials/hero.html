<!-- STATE A: HERO LANDING STATE -->
<main id="hero-section" class="flex-1 flex flex-col items-center justify-center px-4 py-12 -mt-10 select-none max-w-4xl mx-auto w-full">
    
    <!-- Hero Logo with Signature Purple-Blue Gradient -->
    <div class="mb-7 text-center">
        <h1 class="text-6xl sm:text-7xl font-bold tracking-tight qmd-logo-gradient font-sans">
            qmd
        </h1>
        <p class="text-xs sm:text-sm font-normal text-gray-500 dark:text-gray-400 tracking-wide mt-2">
            Query Multiple Documents • Multi-corpus semantic search
        </p>
    </div>

    <!-- Center Search Input Box -->
    <div class="w-full max-w-2xl">
        <form id="hero-search-form" onsubmit="handleFormSubmit(event, 'hero')">
            <div class="flex items-center bg-white dark:bg-[#303134] rounded-full border border-google-border dark:border-[#5f6368] hover:shadow-md focus-within:g-search-shadow focus-within:border-transparent transition-all h-12 px-4 gap-3">
                <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input 
                    id="hero-query"
                    list="past-queries-list"
                    type="text" 
                    class="w-full bg-transparent outline-none text-base text-[#202124] dark:text-[#e8eaed] placeholder-gray-400" 
                    placeholder="Search notes or books with natural language or keyword..."
                    autocomplete="off"
                    autofocus
                    required
                />
                <button type="button" onclick="openScopePicker()" title="Select directory or file scope" class="text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                </button>
            </div>
        </form>

        <!-- Active Scope Filter Chips -->
        <div id="hero-scope-chips" class="hidden flex flex-wrap items-center justify-center gap-2 pt-2"></div>

        <!-- Search Mode Toggles -->
        <div class="flex items-center justify-center gap-3 mt-7">
            <button 
                type="button"
                id="hero-btn-discover"
                title="Best chunk per doc"
                onclick="triggerSearchWithTab('documents', 'hero')" 
                class="hero-search-btn bg-[#f8f9fa] dark:bg-[#303134] hover:bg-[#f1f3f4] dark:hover:bg-[#3c4043] border border-[#f8f9fa] dark:border-[#303134] hover:border-[#dadce0] dark:hover:border-[#5f6368] text-sm text-[#3c4043] dark:text-[#e8eaed] px-5 py-2.5 rounded font-medium shadow-none hover:shadow-sm transition-all flex items-center gap-1.5"
                data-mode="discover"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span>Discover</span>
            </button>
            <button 
                type="button"
                id="hero-btn-search"
                title="Best chunks ordered by docs"
                onclick="triggerSearchWithTab('all', 'hero')" 
                class="hero-search-btn bg-[#f8f9fa] dark:bg-[#303134] hover:bg-[#f1f3f4] dark:hover:bg-[#3c4043] border border-[#f8f9fa] dark:border-[#303134] hover:border-[#dadce0] dark:hover:border-[#5f6368] text-sm text-[#3c4043] dark:text-[#e8eaed] px-5 py-2.5 rounded font-medium shadow-none hover:shadow-sm transition-all flex items-center gap-1.5"
                data-mode="search"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span>Search</span>
            </button>
            <button 
                type="button"
                id="hero-btn-passages"
                title="Best chunks ordered by match"
                onclick="triggerSearchWithTab('passages', 'hero')" 
                class="hero-search-btn bg-[#f8f9fa] dark:bg-[#303134] hover:bg-[#f1f3f4] dark:hover:bg-[#3c4043] border border-[#f8f9fa] dark:border-[#303134] hover:border-[#dadce0] dark:hover:border-[#5f6368] text-sm text-[#3c4043] dark:text-[#e8eaed] px-5 py-2.5 rounded font-medium shadow-none hover:shadow-sm transition-all flex items-center gap-1.5"
                data-mode="passages"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>Passages</span>
            </button>
        </div>

        <!-- Sample Query Suggestions -->
        <div class="mt-8 text-center text-sm text-gray-500 flex flex-col items-center gap-3">
            <span class="text-xs uppercase tracking-wider font-semibold text-gray-400 dark:text-gray-500">Suggested Questions</span>
            {% if sample_questions and sample_questions|length > 0 %}
                {% for sq in sample_questions %}
                    <button type="button" onclick="runSampleQuery({{ sq.question | tojson | forceescape }})" title="From: {{ sq.title | e }}" class="text-blue-600 dark:text-blue-400 hover:underline max-w-full text-left">{{ sq.question | e }}</button>
                {% endfor %}
            {% else %}
                <button type="button" onclick="runSampleQuery('winston churchill habits')" class="text-blue-600 dark:text-blue-400 hover:underline">winston churchill habits</button>
                <button type="button" onclick="runSampleQuery('quantum entanglement notes')" class="text-blue-600 dark:text-blue-400 hover:underline">quantum entanglement notes</button>
                <button type="button" onclick="runSampleQuery('project roadmap Q3')" class="text-blue-600 dark:text-blue-400 hover:underline">project roadmap Q3</button>
            {% endif %}
        </div>
    </div>
</main>
