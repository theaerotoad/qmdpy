<!-- AI Quick Answer Side Panel (Google-ads style card) -->
<aside id="quick-answer-card" 
       class="hidden w-full lg:w-80 xl:w-96 flex-shrink-0 self-start mb-6 lg:mb-0 transition-all duration-300">
  <div class="rounded-xl border border-zinc-200 bg-white/95 p-4 shadow-sm backdrop-blur-sm dark:border-zinc-800 dark:bg-zinc-900/90 dark:shadow-none">
    
    <!-- Card Header -->
    <div class="flex items-center justify-between border-b border-zinc-100 pb-2.5 dark:border-zinc-800/80">
      <div class="flex items-center gap-2">
        <span class="flex h-5 w-5 items-center justify-center rounded-md bg-indigo-100 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-400">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
          </svg>
        </span>
        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-300">Quick Answer</span>
      </div>

      <div class="flex items-center gap-1">
        <!-- Status Indicator -->
        <span id="quick-answer-pulse" class="inline-block h-2 w-2 rounded-full bg-emerald-500 animate-pulse" title="Generating"></span>
        <!-- Dismiss Button -->
        <button id="quick-answer-close-btn" 
                type="button" 
                class="rounded p-1 text-zinc-400 hover:bg-zinc-100 hover:text-zinc-600 dark:text-zinc-500 dark:hover:bg-zinc-800 dark:hover:text-zinc-300" 
                title="Dismiss quick answer">
          <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Loading Skeleton -->
    <div id="quick-answer-loading" class="mt-3 space-y-2">
      <div class="h-3.5 w-5/6 animate-pulse rounded bg-zinc-200 dark:bg-zinc-800"></div>
      <div class="h-3.5 w-full animate-pulse rounded bg-zinc-200 dark:bg-zinc-800"></div>
      <div class="h-3.5 w-2/3 animate-pulse rounded bg-zinc-200 dark:bg-zinc-800"></div>
    </div>

    <!-- Answer Body -->
    <div id="quick-answer-body" class="mt-3 hidden text-xs leading-relaxed text-zinc-700 dark:text-zinc-300">
      <div id="quick-answer-content" class="prose prose-xs dark:prose-invert max-w-none"></div>
    </div>

    <!-- Footer Meta / References -->
    <div id="quick-answer-footer" class="mt-3.5 hidden border-t border-zinc-100 pt-2 text-[11px] text-zinc-400 dark:border-zinc-800/60 dark:text-zinc-500">
      <span>Grounded on document results</span>
    </div>

  </div>
</aside>
