<main id="results-wrapper" class="hidden flex-1 pb-16">
    
    <div id="results-toolbar" class="bg-white dark:bg-[#202124]">
        <div class="max-w-[1400px] mx-auto px-4 sm:pl-28 py-3 text-xs text-gray-500 dark:text-gray-400" id="result-stats">
            Searching documents...
        </div>
    </div>

    <div id="search-progress" class="hidden w-full h-0.5 bg-blue-100 dark:bg-slate-800 overflow-hidden">
        <div class="w-full h-full bg-blue-600 origin-left animate-pulse"></div>
    </div>

    <div class="max-w-[1400px] mx-auto px-4 sm:pl-28 pt-3">
        <div id="serp-scope-chips" class="hidden flex flex-wrap items-center gap-1.5"></div>
    </div>

    <div class="max-w-[1400px] mx-auto px-4 sm:pl-28 py-6">
        <div class="max-w-5xl space-y-9" id="results">
            </div>

        <div id="results-footer" class="hidden mt-14 pt-6 border-t border-google-border dark:border-google-borderDark max-w-5xl flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
            <div class="flex items-center gap-2">
                <span>Knowledge Base: <strong id="footer-doc-count" class="text-gray-800 dark:text-gray-200 font-normal">Indexed Repositories</strong></span>
            </div>
            <div class="flex items-center gap-1 font-mono">
                <button type="button" class="px-2.5 py-1 rounded bg-blue-50 text-blue-600 font-bold dark:bg-blue-900/30 dark:text-blue-400">1</button>
                <button type="button" onclick="showToast('Showing all available top results')" class="px-2.5 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800">2</button>
                <button type="button" onclick="showToast('Showing all available top results')" class="px-2.5 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800">3</button>
                <button type="button" onclick="showToast('Loaded all ranked candidates')" class="px-2.5 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800">Next &gt;</button>
            </div>
        </div>
    </div>
</main>
