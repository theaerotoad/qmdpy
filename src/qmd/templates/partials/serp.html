<main id="results-wrapper" class="hidden flex-1 pb-16">
    
    <div id="results-toolbar" class="border-b border-gray-100 dark:border-gray-800 bg-white dark:bg-[#202124]">
        <div class="max-w-[1400px] mx-auto px-4 sm:pl-28 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
            <div class="text-gray-500 dark:text-gray-400" id="result-stats">
                Searching documents...
            </div>

            <div class="flex items-center gap-2">
                <button 
                    type="button"
                    id="copy-json"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded text-gray-700 dark:text-gray-200 bg-gray-100 hover:bg-gray-200 dark:bg-[#303134] dark:hover:bg-[#3c4043] border border-gray-200 dark:border-gray-700 font-medium transition-colors text-xs"
                    title="Export matching chunks as canonical XML"
                >
                    <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span>Copy XML for LLM</span>
                </button>
                
                <button 
                    type="button"
                    id="copy-prompt"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded text-white bg-blue-600 hover:bg-blue-700 font-medium transition-colors shadow-sm text-xs"
                    title="Copy full synthesis prompt with references"
                >
                    <svg class="w-3.5 h-3.5 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    <span>Copy Prompt &amp; References</span>
                </button>
            </div>
        </div>
    </div>

    <div id="search-progress" class="hidden w-full h-0.5 bg-blue-100 dark:bg-slate-800 overflow-hidden">
        <div class="w-full h-full bg-blue-600 origin-left animate-pulse"></div>
    </div>

    <div class="max-w-[1400px] mx-auto px-4 sm:pl-28 pt-3">
        <div id="serp-scope-chips" class="hidden flex flex-wrap items-center gap-1.5"></div>
    </div>

    <div class="max-w-[1400px] mx-auto px-4 sm:pl-28 py-6">
        <div class="max-w-5xl space-y-9" id="results">
            </div>

        <div id="results-footer" class="hidden mt-14 pt-6 border-t border-google-border dark:border-google-borderDark max-w-5xl flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
            <div class="flex items-center gap-2">
                <span>Knowledge Base: <strong id="footer-doc-count" class="text-gray-800 dark:text-gray-200 font-normal">Indexed Repositories</strong></span>
            </div>
            <div class="flex items-center gap-1 font-mono">
                <button type="button" class="px-2.5 py-1 rounded bg-blue-50 text-blue-600 font-bold dark:bg-blue-900/30 dark:text-blue-400">1</button>
                <button type="button" onclick="showToast('Showing all available top results')" class="px-2.5 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800">2</button>
                <button type="button" onclick="showToast('Showing all available top results')" class="px-2.5 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800">3</button>
                <button type="button" onclick="showToast('Loaded all ranked candidates')" class="px-2.5 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800">Next &gt;</button>
            </div>
        </div>
    </div>
</main>
