<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMD Setup Configurator</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        google: {
                            blue: '#1a73e8',
                            border: '#dadce0',
                            borderDark: '#3c4043'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem; }
        .form-input { width: 100%; border: 1px solid var(--tw-prose-counters, #dadce0); border-radius: 0.375rem; padding: 0.375rem 0.5rem; font-size: 0.875rem; background: transparent; outline: none;}
        .form-input:focus { border-color: #1a73e8; }
        .dark .form-input { border-color: #5f6368; color: #e8eaed; }
        .dark .form-input:focus { border-color: #8ab4f8; }
        .form-checkbox { margin-right: 0.5rem; }
        .section-title { font-size: 1.125rem; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; border-bottom: 1px solid #dadce0; padding-bottom: 0.5rem; }
        .dark .section-title { border-color: #3c4043; }
        .collection-card { border: 1px solid #dadce0; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; }
        .dark .collection-card { border-color: #3c4043; background: #282a2d; }
    </style>
</head>
<body class="bg-white dark:bg-[#171717] text-[#202124] dark:text-[#e8eaed] min-h-full font-sans antialiased selection:bg-blue-600 selection:text-white transition-colors duration-150">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="w-full border-b border-google-border dark:border-google-borderDark bg-white dark:bg-[#202124] shrink-0">
            <div class="px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="font-bold text-lg text-blue-600 dark:text-blue-400">QMD Configurator</div>
                </div>
                <div class="flex items-center gap-4">
                    <button id="theme-toggle" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#303134] rounded-full" title="Toggle Theme">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                    </button>
                    <button id="delete-btn" disabled class="hidden px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded transition-all">Delete Config</button>
                    <button id="save-btn" disabled class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded opacity-50 cursor-not-allowed transition-all">Save Config</button>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-64 border-r border-google-border dark:border-google-borderDark bg-gray-50 dark:bg-[#202124] flex flex-col">
                <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                    <span class="font-semibold text-sm">YAML Files</span>
                    <button id="new-file-btn" class="p-1 text-gray-500 hover:text-blue-600 dark:text-gray-400 dark:hover:text-blue-400 rounded transition-colors" title="New Configuration File">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                </div>
                <ul id="file-list" class="flex-1 overflow-y-auto p-2 space-y-1 text-sm">
                    <li class="text-gray-500 italic p-2">Loading...</li>
                </ul>
            </aside>

            <!-- Editor Pane -->
            <main class="flex-1 overflow-y-auto bg-white dark:bg-[#171717] p-6">
                <div id="editor-empty" class="h-full flex items-center justify-center text-gray-400">
                    Select a YAML file from the sidebar to edit.
                </div>
                
                <form id="config-form" class="hidden max-w-4xl mx-auto pb-20">
                    <!-- Form will be dynamically populated -->
                    <div id="form-content"></div>
                </form>
            </main>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-800 text-white text-sm px-4 py-3 rounded shadow-lg">
        <span id="toast-msg"></span>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-[#282a2d] rounded-lg shadow-xl max-w-sm w-full p-6 mx-4">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">Delete Configuration</h3>
            <p class="text-gray-600 dark:text-gray-300 text-sm mb-6">Are you sure you want to delete <span id="delete-filename-display" class="font-mono font-bold text-red-500"></span>? This action cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button id="cancel-delete-btn" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#3c4043] rounded transition-colors">Cancel</button>
                <button id="confirm-delete-btn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded transition-colors">Delete</button>
            </div>
        </div>
    </div>

    <!-- New File Modal -->
    <div id="new-file-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-[#282a2d] rounded-lg shadow-xl max-w-sm w-full p-6 mx-4">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">New Configuration File</h3>
            <p class="text-gray-600 dark:text-gray-300 text-sm mb-4">Enter a name for the new YAML file (e.g., config.yml).</p>
            <input type="text" id="new-file-name" class="w-full form-input mb-6" placeholder="new_config.yml">
            <div class="flex justify-end gap-3">
                <button id="cancel-new-btn" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#3c4043] rounded transition-colors">Cancel</button>
                <button id="confirm-new-btn" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded transition-colors">Create</button>
            </div>
        </div>
    </div>

    <!-- Directory Picker Modal -->
    <div id="dir-picker-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-[#282a2d] rounded-lg shadow-xl max-w-lg w-full p-6 mx-4 flex flex-col max-h-[80vh]">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">Select Directory</h3>
            <div class="flex items-center gap-2 mb-4">
                <button id="dir-picker-up" class="p-1 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                </button>
                <input type="text" id="dir-picker-path" class="form-input flex-1 font-mono text-sm bg-gray-50 dark:bg-[#202124]" readonly>
            </div>
            <div class="flex-1 overflow-y-auto border border-gray-200 dark:border-gray-700 rounded mb-4">
                <ul id="dir-picker-list" class="divide-y divide-gray-100 dark:divide-gray-800 text-sm">
                    <!-- dirs go here -->
                </ul>
            </div>
            <div class="flex justify-end gap-3 shrink-0">
                <button id="cancel-dir-btn" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-[#3c4043] rounded transition-colors">Cancel</button>
                <button id="confirm-dir-btn" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded transition-colors">Select</button>
            </div>
        </div>
    </div>

<script>
    // Theme logic
    const toggleBtn = document.getElementById('theme-toggle');
    const html = document.documentElement;
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
    }
    toggleBtn.addEventListener('click', () => {
        html.classList.toggle('dark');
        localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    let currentFile = null;
    let configData = {};

    const fileListEl = document.getElementById('file-list');
    const editorEmptyEl = document.getElementById('editor-empty');
    const configFormEl = document.getElementById('config-form');
    const formContentEl = document.getElementById('form-content');
    const saveBtn = document.getElementById('save-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const newFileBtn = document.getElementById('new-file-btn');
    const toastEl = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');

    // Modals
    const deleteModal = document.getElementById('delete-modal');
    const newFileModal = document.getElementById('new-file-modal');
    const dirPickerModal = document.getElementById('dir-picker-modal');

    function showToast(msg) {
        toastMsg.textContent = msg;
        toastEl.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
            toastEl.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
    }

    async function loadFiles() {
        try {
            const res = await fetch('/api/yamls');
            const data = await res.json();
            if (data.files) {
                fileListEl.innerHTML = '';
                data.files.forEach(f => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left px-3 py-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors truncate';
                    btn.textContent = f;
                    btn.onclick = () => loadFile(f, btn);
                    li.appendChild(btn);
                    fileListEl.appendChild(li);
                });
                if (data.files.length === 0) {
                    fileListEl.innerHTML = '<li class="text-gray-500 italic p-2">No YAML files found</li>';
                }
            }
        } catch (e) {
            fileListEl.innerHTML = '<li class="text-red-500 p-2">Error loading files</li>';
        }
    }

    async function loadFile(filename, btnEl) {
        document.querySelectorAll('#file-list button').forEach(b => {
            b.classList.remove('bg-blue-100', 'dark:bg-blue-900/30', 'text-blue-700', 'dark:text-blue-300', 'font-semibold');
        });
        btnEl.classList.add('bg-blue-100', 'dark:bg-blue-900/30', 'text-blue-700', 'dark:text-blue-300', 'font-semibold');
        
        try {
            const res = await fetch(`/api/yamls/${encodeURIComponent(filename)}`);
            const data = await res.json();
            if (data.data) {
                currentFile = filename;
                configData = data.data;
                renderForm();
                editorEmptyEl.classList.add('hidden');
                configFormEl.classList.remove('hidden');
                saveBtn.disabled = false;
                saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                deleteBtn.classList.remove('hidden');
                deleteBtn.disabled = false;
            }
        } catch (e) {
            showToast("Error loading file");
        }
    }

    function resetEditor() {
        currentFile = null;
        configData = {};
        configFormEl.classList.add('hidden');
        editorEmptyEl.classList.remove('hidden');
        saveBtn.disabled = true;
        saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
        deleteBtn.classList.add('hidden');
    }

    // Delete file logic
    deleteBtn.addEventListener('click', () => {
        if (!currentFile) return;
        document.getElementById('delete-filename-display').textContent = currentFile;
        deleteModal.classList.remove('hidden');
    });

    document.getElementById('cancel-delete-btn').addEventListener('click', () => {
        deleteModal.classList.add('hidden');
    });

    document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
        if (!currentFile) return;
        try {
            const res = await fetch(`/api/yamls/${encodeURIComponent(currentFile)}`, {
                method: 'DELETE'
            });
            const result = await res.json();
            if (result.status === 'success') {
                showToast(result.message);
                resetEditor();
                loadFiles();
            } else {
                showToast("Error: " + result.error);
            }
        } catch(e) {
            showToast("Error deleting file");
        } finally {
            deleteModal.classList.add('hidden');
        }
    });

    // New file logic
    newFileBtn.addEventListener('click', () => {
        document.getElementById('new-file-name').value = 'config.yml';
        newFileModal.classList.remove('hidden');
        document.getElementById('new-file-name').select();
    });

    document.getElementById('cancel-new-btn').addEventListener('click', () => {
        newFileModal.classList.add('hidden');
    });

    document.getElementById('confirm-new-btn').addEventListener('click', async () => {
        let filename = document.getElementById('new-file-name').value.trim();
        if (!filename) return;
        if (!filename.endsWith('.yml') && !filename.endsWith('.yaml')) {
            filename += '.yml';
        }
        
        let baseData = {};
        const buttons = document.querySelectorAll('#file-list button');
        const hasDefaults = Array.from(buttons).find(b => b.textContent === 'defaults.yml' || b.textContent === 'defaults.yaml');
        if (hasDefaults) {
            try {
                const defRes = await fetch(`/api/yamls/${encodeURIComponent(hasDefaults.textContent)}`);
                const defData = await defRes.json();
                if (defData.data) {
                    baseData = defData.data;
                }
            } catch (e) {
                console.warn("Could not load defaults config", e);
            }
        }
        
        // Auto-set db_path
        const dbName = filename.replace(/\.yaml$/, '').replace(/\.yml$/, '') + '.db';
        baseData.db_path = `./${dbName}`;

        try {
            const res = await fetch(`/api/yamls/${encodeURIComponent(filename)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: baseData })
            });
            const result = await res.json();
            if (result.status === 'success') {
                showToast(`Created ${filename}`);
                newFileModal.classList.add('hidden');
                await loadFiles();
                
                // Select the new file
                const buttons = document.querySelectorAll('#file-list button');
                for (let b of buttons) {
                    if (b.textContent === filename) {
                        b.click();
                        break;
                    }
                }
            } else {
                showToast("Error: " + result.error);
            }
        } catch (e) {
            showToast("Error creating file");
        }
    });

    saveBtn.addEventListener('click', async () => {
        if (!currentFile) return;
        saveBtn.textContent = 'Saving...';
        
        // Sync collections from DOM before saving
        syncCollectionsFromDOM();

        try {
            const res = await fetch(`/api/yamls/${encodeURIComponent(currentFile)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: configData })
            });
            const result = await res.json();
            if (result.status === 'success') {
                showToast("Configuration saved successfully!");
            } else {
                showToast("Error: " + result.error);
            }
        } catch (e) {
            showToast("Error saving configuration");
        } finally {
            saveBtn.textContent = 'Save Config';
        }
    });

    const schema = [
        {
            title: "Core Paths & Storage",
            fields: [
                { key: 'db_path', type: 'text', label: 'Database Path' },
                { key: 'history_db_path', type: 'text', label: 'History DB Path' },
                { key: 'vector_quantization', type: 'select', label: 'Vector Quantization', options: ['none', 'int8', 'bit'] }
            ]
        },
        {
            title: "LLM & Embeddings",
            fields: [
                { key: 'llm_url', type: 'text', label: 'LLM URL' },
                { key: 'api_key', type: 'text', label: 'API Key (Optional)' },
                { key: 'embed_url', type: 'text', label: 'Embed URL' },
                { key: 'embed_api_key', type: 'text', label: 'Embed API Key' },
                { key: 'embed_model', type: 'text', label: 'Embed Model' },
                { key: 'rerank_url', type: 'text', label: 'Rerank URL' },
                { key: 'rerank_api_key', type: 'text', label: 'Rerank API Key' },
                { key: 'rerank_model', type: 'text', label: 'Rerank Model' },
                { key: 'generate_model', type: 'text', label: 'Generate Model' },
                { key: 'request_timeout', type: 'number', label: 'Request Timeout' },
                { key: 'embed_batch_size', type: 'number', label: 'Embed Batch Size' }
            ]
        },
        {
            title: "Vision & Multimodal",
            fields: [
                { key: 'vision_url', type: 'text', label: 'Vision API URL' },
                { key: 'vision_api_key', type: 'text', label: 'Vision API Key' },
                { key: 'multimodal_url', type: 'text', label: 'Multimodal LLM URL' },
                { key: 'multimodal_api_key', type: 'text', label: 'Multimodal API Key' },
                { key: 'multimodal_model', type: 'text', label: 'Multimodal Model' },
                { key: 'multimodal_prompt', type: 'text', label: 'Multimodal Prompt' },
                { key: 'max_image_concurrency', type: 'number', label: 'Max Image Concurrency' }
            ]
        },
        {
            title: "Chunking & Parsing",
            fields: [
                { key: 'target_chunk_size', type: 'number', label: 'Target Chunk Size' },
                { key: 'max_chunk_size', type: 'number', label: 'Max Chunk Size' },
                { key: 'strip_links', type: 'checkbox', label: 'Strip Links' },
                { key: 'spacy_model', type: 'text', label: 'spaCy Model' }
            ]
        },
        {
            title: "Search Sizing & Limits",
            fields: [
                { key: 'cache_search_results', type: 'checkbox', label: 'Cache Search Results' },
                { key: 'fts_limit', type: 'number', label: 'FTS Limit' },
                { key: 'vec_limit', type: 'number', label: 'Vector Limit' },
                { key: 'rerank_candidates', type: 'number', label: 'Rerank Candidates' },
                { key: 'default_limit', type: 'number', label: 'Default Limit' }
            ]
        },
        {
            title: "System Integration",
            fields: [
                { key: 'include', type: 'textarea', label: 'Included YAMLs (one path per line)' },
                { key: 'allow_open_file', type: 'checkbox', label: 'Allow Open File' },
                { key: 'includes_update', type: 'checkbox', label: 'Allow Includes Update' }
            ]
        }
    ];

    function renderField(field, value, onChange) {
        const val = value !== undefined ? value : '';
        const id = `field-${field.key}`;
        
        let inputHtml = '';
        if (field.type === 'text' || field.type === 'number') {
            inputHtml = `<input type="${field.type}" id="${id}" class="form-input" value="${val}" />`;
        } else if (field.type === 'checkbox') {
            const checked = val ? 'checked' : '';
            inputHtml = `<label class="flex items-center"><input type="checkbox" id="${id}" class="form-checkbox h-4 w-4 text-blue-600 rounded" ${checked} /><span class="ml-2 text-sm">${field.label}</span></label>`;
        } else if (field.type === 'select') {
            const options = field.options.map(opt => `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('');
            inputHtml = `<select id="${id}" class="form-input">${options}</select>`;
        } else if (field.type === 'textarea') {
            const displayVal = Array.isArray(val) ? val.join('\n') : (val || '');
            inputHtml = `<textarea id="${id}" class="form-input" rows="3" placeholder="...">${displayVal}</textarea>`;
        }

        const div = document.createElement('div');
        div.className = 'form-group col-span-1';
        if (field.type !== 'checkbox') {
            div.innerHTML = `<label for="${id}">${field.label}</label>${inputHtml}`;
        } else {
            div.innerHTML = inputHtml;
        }

        setTimeout(() => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('change', (e) => {
                    const newVal = field.type === 'checkbox' ? e.target.checked : 
                                   field.type === 'number' ? Number(e.target.value) : 
                                   field.type === 'textarea' ? e.target.value.split('\n').map(s=>s.trim()).filter(s=>s) :
                                   e.target.value;
                    onChange(field.key, newVal);
                });
            }
        }, 0);

        return div;
    }

    function renderForm() {
        formContentEl.innerHTML = '';
        
        schema.forEach(section => {
            const sectionDiv = document.createElement('div');
            sectionDiv.innerHTML = `<h2 class="section-title">${section.title}</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>`;
            const grid = sectionDiv.querySelector('.grid');
            
            section.fields.forEach(f => {
                grid.appendChild(renderField(f, configData[f.key], (key, val) => {
                    if (val === '' || val === null) {
                        delete configData[key];
                    } else {
                        configData[key] = val;
                    }
                }));
            });
            formContentEl.appendChild(sectionDiv);
        });

        // Collections Section
        const collSection = document.createElement('div');
        collSection.innerHTML = `
            <div class="flex items-center justify-between mt-8 mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">
                <h2 class="text-lg font-semibold">Collections</h2>
                <button type="button" id="add-collection-btn" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-sm font-medium rounded">+ Add Collection</button>
            </div>
            <div id="collections-container" class="space-y-4"></div>
        `;
        formContentEl.appendChild(collSection);

        document.getElementById('add-collection-btn').addEventListener('click', () => {
            if (!configData.collections) configData.collections = {};
            const baseName = "New Collection";
            let name = baseName;
            let i = 1;
            while(configData.collections[name]) {
                name = `${baseName} ${i}`;
                i++;
            }
            configData.collections[name] = { path: "" };
            renderCollections();
        });

        renderCollections();
    }

    function renderCollections() {
        const container = document.getElementById('collections-container');
        container.innerHTML = '';
        if (!configData.collections) return;

        Object.keys(configData.collections).forEach(collName => {
            const coll = configData.collections[collName];
            const div = document.createElement('div');
            div.className = 'collection-card relative';
            div.setAttribute('data-coll-name', collName);

            const exts = coll.file_extensions ? (Array.isArray(coll.file_extensions) ? coll.file_extensions.join(', ') : coll.file_extensions) : '';

            div.innerHTML = `
                <button type="button" class="delete-coll-btn absolute top-3 right-3 text-red-500 hover:text-red-700 text-sm font-medium">Delete</button>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="form-group col-span-2 md:col-span-1">
                        <label>Collection Name</label>
                        <input type="text" class="form-input coll-name-input" value="${collName}" />
                    </div>
                    <div class="form-group col-span-2 md:col-span-1">
                        <label>Path</label>
                        <div class="flex gap-2">
                            <input type="text" class="form-input coll-path-input flex-1" value="${coll.path || ''}" />
                            <button type="button" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 dark:bg-[#303134] dark:hover:bg-[#3c4043] rounded border border-gray-300 dark:border-gray-600 text-sm browse-btn" title="Browse Directory">📁</button>
                        </div>
                    </div>
                    <div class="form-group col-span-2 md:col-span-1">
                        <label>Glob Pattern</label>
                        <input type="text" class="form-input coll-glob-input" value="${coll.glob || '**/*'}" />
                    </div>
                    <div class="form-group col-span-2 md:col-span-1">
                        <label>File Extensions (comma separated, e.g. .md, .pdf)</label>
                        <input type="text" class="form-input coll-ext-input" value="${exts}" />
                    </div>
                    <div class="form-group col-span-2 flex gap-4">
                        <label class="flex items-center"><input type="checkbox" class="form-checkbox h-4 w-4 text-blue-600 rounded coll-convert-input" ${coll.convert_non_md !== false ? 'checked' : ''} /><span class="ml-2 text-sm">Convert Non-MD</span></label>
                        <label class="flex items-center"><input type="checkbox" class="form-checkbox h-4 w-4 text-blue-600 rounded coll-dirlists-input" ${coll.dirlists ? 'checked' : ''} /><span class="ml-2 text-sm">Index Dirlists</span></label>
                    </div>
                </div>
            `;

            div.querySelector('.delete-coll-btn').addEventListener('click', () => {
                delete configData.collections[collName];
                renderCollections();
            });

            div.querySelector('.browse-btn').addEventListener('click', () => {
                const input = div.querySelector('.coll-path-input');
                openDirPicker(input.value, (newPath) => {
                    input.value = newPath;
                    syncCollectionsFromDOM();
                });
            });

            container.appendChild(div);
        });
    }

    // Directory Picker Logic
    let currentDirCallback = null;

    async function openDirPicker(currentPath, callback) {
        currentDirCallback = callback;
        await loadDir(currentPath || '');
        dirPickerModal.classList.remove('hidden');
    }

    async function loadDir(path) {
        try {
            const res = await fetch(`/api/fs/directories?path=${encodeURIComponent(path)}`);
            const data = await res.json();
            if(data.error) throw new Error(data.error);
            
            document.getElementById('dir-picker-path').value = data.current;
            const upBtn = document.getElementById('dir-picker-up');
            if (data.parent) {
                upBtn.onclick = () => loadDir(data.parent);
                upBtn.disabled = false;
                upBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                upBtn.onclick = null;
                upBtn.disabled = true;
                upBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            const list = document.getElementById('dir-picker-list');
            list.innerHTML = '';
            data.dirs.forEach(d => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2';
                btn.innerHTML = `<svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg> <span>${d}</span>`;
                btn.onclick = () => loadDir(data.current + (data.current.endsWith('/') || data.current.endsWith('\\') ? '' : '/') + d);
                li.appendChild(btn);
                list.appendChild(li);
            });
        } catch(e) {
            showToast("Error loading directory");
        }
    }

    document.getElementById('cancel-dir-btn').addEventListener('click', () => {
        dirPickerModal.classList.add('hidden');
    });
    document.getElementById('confirm-dir-btn').addEventListener('click', () => {
        if(currentDirCallback) {
            currentDirCallback(document.getElementById('dir-picker-path').value);
        }
        dirPickerModal.classList.add('hidden');
    });

    function syncCollectionsFromDOM() {
        const container = document.getElementById('collections-container');
        const newCollections = {};
        container.querySelectorAll('.collection-card').forEach(card => {
            const name = card.querySelector('.coll-name-input').value.trim();
            if (!name) return;
            const extsRaw = card.querySelector('.coll-ext-input').value.trim();
            
            newCollections[name] = {
                path: card.querySelector('.coll-path-input').value.trim(),
                glob: card.querySelector('.coll-glob-input').value.trim(),
                convert_non_md: card.querySelector('.coll-convert-input').checked,
                dirlists: card.querySelector('.coll-dirlists-input').checked
            };
            if (extsRaw) {
                newCollections[name].file_extensions = extsRaw.split(',').map(s => s.trim()).filter(s => s);
            }
        });
        configData.collections = newCollections;
    }

    loadFiles();
</script>
</body>
</html>
